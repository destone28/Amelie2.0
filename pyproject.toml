[project]
name = "amelie"
version = "1.0.0"
description = "Supporto da tavolo che riconosce un vino dall'etichetta e ne racconta la storia"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Emilio Destratis" }]

# Le versioni esatte collaudate sulla UNO Q stanno in requirements.txt, che e'
# quello che installa scripts/install.sh.
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "rapidocr>=3.9",
    "onnxruntime>=1.20",
    "rapidfuzz>=3.9",
    "msgpack>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "piper-tts>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[project.scripts]
amelie = "amelie.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
