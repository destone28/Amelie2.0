<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Amelie</title>
<style>
/* ===========================================================================
   LA SCHERMATA D'AVVIO.

   Serve a coprire i quaranta secondi fra l'accensione e il dispositivo pronto.
   Non è una cortesia: senza, l'ospite vede la scrivania del sistema operativo,
   e poi una pagina bianca, e poi Amelie. Tre ambienti diversi per un oggetto
   che deve sembrarne uno solo.

   È un FILE, non una pagina servita: deve comparire quando il server non
   esiste ancora — è esattamente per quello che esiste. Quindi qui dentro non
   c'è niente che venga da fuori: né font, né immagini, né fogli di stile. La
   copia dei colori e delle misure da index.html è voluta, ed è l'unico
   duplicato accettabile del progetto: l'alternativa è che la schermata
   d'avvio dipenda dalla cosa che sta aspettando.

   Il fondo è lo STESSO di index.html, e lo stesso che amelie-sessione.sh
   stende sulla radice di X e amelie-sipario.sh sul framebuffer. Dall'istante
   in cui il pannello si accende fino al racconto non c'è un solo stacco di
   colore.
   =========================================================================== */
:root {
  --bordeaux-scuro:  #3D1512;
  --oro-scuro:       #8A6B30;
  --oro:             #C8860D;
  --oro-chiaro:      #E3B457;
  --avorio:          #F4EDE3;
  --avorio-fioco:    #8C7F74;
  --carbone:         #14100F;
  --vino:            #A8323F;
  --vino-fondo:      #5A1320;
  --vino-pelo:       #E59A86;
  --fondo: radial-gradient(ellipse at 50% 118%,
             #2E100D 0%, var(--bordeaux-scuro) 46%, var(--carbone) 100%);
  --passo: 12px;
  --t-marchio: 104px;
  --t-sottotit: 34px;
  --t-voce:     44px;
  --t-piccolo:  30px;
  --t-minuto:   24px;
  --ciclo: 3s;
  --curva: cubic-bezier(.22,.61,.36,1);
}
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  cursor: none; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
}
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--fondo); color: var(--oro-chiaro);
  /* Il carattere qui non c'e': la pagina si apre da file, prima che esista il
     server che lo serve, e Chromium non carica caratteri da file:// a una
     pagina aperta da file://. Non serve: il marchio e' disegnato a tracciati,
     e l'unica scritta e' quella di servizio in fondo. */
  font-family: "EB Garamond", Garamond, serif;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
svg { display: block; }

/* Come in index.html: il disegno è per 1280x720 e si scala sul pannello. */
#scena {
  position: absolute; left: 50%; top: 50%;
  width: 1280px; height: 720px; margin: -360px 0 0 -640px;
  transform: scale(var(--scala, 1)); transform-origin: center center;
}

/* La STESSA impaginazione della schermata d'attesa, con i tre passi presenti
   ma invisibili: il marchio deve cadere nel punto esatto in cui lo trovera'
   index.html, altrimenti al passaggio salta e il passaggio si vede. Le
   altezze delle righe sono multipli del corpo, non del carattere, quindi
   coincidono anche qui dove il Garamond non c'e'. Se cambia l'attesa, cambia
   anche questo: e' l'unico duplicato accettato del progetto. */
#attesa {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: calc(var(--passo) * 2) calc(var(--passo) * 5) calc(var(--passo) * 3);
}
/* Il marchio e i suoi disegni: gli stessi di index.html, riga per riga. */
.definizioni { position: absolute; width: 0; height: 0; overflow: hidden; }
#vino .alto  { stop-color: var(--vino); }
#vino .basso { stop-color: var(--vino-fondo); }
.segno .linea {
  fill: none; stroke: var(--oro-chiaro); stroke-width: 2.6px;
  stroke-linecap: round; stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}
.segno .vino { fill: url(#vino); }
.segno .pelo { fill: none; stroke: var(--vino-pelo); stroke-width: 1.4px;
               vector-effect: non-scaling-stroke; opacity: .75; }
.segno .riflesso { fill: none; stroke: var(--avorio); stroke-width: 1.8px;
                   stroke-linecap: round; vector-effect: non-scaling-stroke;
                   opacity: .28; }
.marchio { display: flex; flex-direction: column; align-items: center;
           gap: calc(var(--passo) * .8); }
.marchio .calice { height: 118px; width: auto; overflow: visible; }
/* Accanto al nome, che ha aste piene, il filo del calice e' un poco piu' deciso. */
.marchio .calice .linea { stroke-width: 3px; }
.marchio .nome { height: var(--t-marchio); width: auto; overflow: visible; }
.marchio .parola { fill: var(--oro-chiaro); }
/* Nel calice il vino ruota, come quando lo si fa girare prima di assaggiarlo.
   Dice «sto arrivando» senza contare secondi che nessuno puo' prevedere: una
   barra di avanzamento finta sarebbe una bugia scritta sul primo schermo che
   si vede. Ruota attorno al centro del pelo, cosi' il livello non cambia. */
.marchio .calice .livello {
  transform-box: view-box; transform-origin: 60px 62px;
  animation: ruota calc(var(--ciclo) * 1.6) ease-in-out infinite;
}
@keyframes ruota { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
@media (prefers-reduced-motion: reduce) { .marchio .calice .livello { animation: none; } }
.motto { visibility: hidden; font-size: var(--t-sottotit); line-height: 1.3;
         margin-top: calc(var(--passo) * 1.2); }
.filo {
  width: 220px; height: 2px; flex: none; margin-top: calc(var(--passo) * 2.2);
  background: linear-gradient(90deg, transparent, var(--oro-scuro), transparent);
}
.passi { visibility: hidden; margin-top: calc(var(--passo) * 2.5);
         display: flex; flex-direction: column; gap: 4px; }
.passi .icone { height: 84px; margin-bottom: calc(var(--passo) * 1.1); }
.passi .t { font-size: var(--t-voce); line-height: 1.15; }
.passi .s { font-size: var(--t-piccolo); line-height: 1.25; }

/* Se ci mette molto più del solito, lo dice. Un dispositivo che resta sul
   marchio per cinque minuti senza spiegare niente non si distingue da uno
   rotto, e chi lo guarda non ha una tastiera per chiederglielo.
   In due lingue: qui la lingua scelta non si sa ancora, sta nel server che
   non ha ancora risposto. */
#lento {
  position: absolute; left: 0; right: 0; bottom: calc(var(--passo) * 4);
  text-align: center; font-size: var(--t-minuto); line-height: 1.6;
  color: var(--avorio-fioco);
  opacity: 0; transition: opacity 1.2s var(--curva);
}
#lento.visibile { opacity: 1; }
</style>
</head>

<script>
"use strict";

/* Come in index.html: `min(100vw / 1280, 100vh / 720)` in CSS sembra giusto ma
   una divisione fra lunghezze resta una lunghezza, e scale() vuole un numero
   puro. Il fattore lo calcola qui il JavaScript. */
function adattaScena() {
  document.documentElement.style.setProperty(
    "--scala", Math.min(innerWidth / 1280, innerHeight / 720));
}
adattaScena();
addEventListener("resize", adattaScena);

const APP = "http://127.0.0.1:8080/";
/* Scritto per esteso e non composto: e' l'unico legame fra questa pagina e il
   dispositivo, e deve potersi leggere da qui senza ricostruirlo a mente. */
const PRONTO = "http://127.0.0.1:8080/pronto";
const PERIODO_MS = 400;
/* Quanto si aspetta prima di ammettere che ci sta mettendo troppo. Un avvio
   sano arriva in cinquanta secondi scarsi, di cui una trentina per le due
   voci; novanta secondi sono il doppio abbondante, quindi qui c'è davvero
   qualcosa che non va. */
const PAZIENZA_MS = 90000;

setTimeout(() => document.getElementById("lento").classList.add("visibile"),
           PAZIENZA_MS);

/* Si aspetta che il dispositivo sia PRONTO, non che il server risponda. Fra le
   due cose ci sono le due voci da caricare, una trentina di secondi: andarsene
   appena il server risponde significa mostrare all'ospite una schermata viva
   su un dispositivo che alla prima frase resterebbe muto. */
let vado = false;
function guarda() {
  fetch(PRONTO, { cache: "no-store" })
    .then(r => r.json())
    .then(d => {
      if (!d.pronta || vado) return;
      vado = true;
      /* replace e non href: così questa pagina non resta nella cronologia, e
         un gesto di ritorno — che su un chiosco non dovrebbe esistere, ma i
         browser li inventano — non riporta mai indietro all'avvio. */
      location.replace(APP);
    })
    .catch(() => {})
    .finally(() => { if (!vado) setTimeout(guarda, PERIODO_MS); });
}
guarda();
</script>
