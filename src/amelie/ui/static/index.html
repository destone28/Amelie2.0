const $ = (id) => document.getElementById(id);
const viste = ["attesa", "lavoro", "racconto", "avviso"];
/* Le scritte che arrivano dal server e servono a piu' di un posto. Stanno qui
   perche' il messaggio che le porta arriva a ogni cambio di lingua, e chi le
   usa puo' essere disegnato molto dopo. */
const parole = {};

/* Un chiosco non deve mai comportarsi da pagina: niente menu contestuale al
   tocco lungo, niente trascinamento, niente ingrandimento a due dita. Sono
   difetti che si vedono solo con un dito vero su un tavolo vero. */
for (const evento of ["contextmenu", "dragstart", "gesturestart", "selectstart"]) {
  document.addEventListener(evento, (e) => {
    /* Nei campi dell'editor il cursore si sposta col dito: e' l'unico posto. */
    if (evento === "selectstart" && e.target.closest && e.target.closest(".k-campo")) return;
    e.preventDefault();
  }, { passive: false });
}

/* La scena è disegnata per 1280x720 e ci resta: qui si calcola di quanto va
   ridotta per stare nel pannello, qualunque risoluzione gli venga data. Sul
   minore dei due rapporti, perché 800x480 è 5:3 e il disegno è 16:9: scalando
   sulla sola larghezza il fondo del racconto finirebbe fuori dal vetro. */
function adattaScena() {
  const k = Math.min(innerWidth / 1280, innerHeight / 720);
  document.documentElement.style.setProperty("--scala", k);
}
adattaScena();
addEventListener("resize", adattaScena);

/* La sola schermata in cui e' lecito chiudere: il racconto. Nelle altre non
   c'e' niente da annullare - in attesa si e' gia' a casa, e durante la
   lettura fermarsi a meta' lascerebbe l'OCR a girare. (Non c'e' una scelta
   fra candidati da annullare: col dubbio si dice il piu' generico.) */
const VISTE_ANNULLABILI = ["racconto"];

function mostra(nome) {
  viste.forEach(v => $(v).classList.toggle("attiva", v === nome));
  $("annulla").classList.toggle("disponibile", VISTE_ANNULLABILI.includes(nome));
}

/* Quello che il dispositivo sta dicendo, adesso. Arriva già temporizzato: il
   server la manda quando la frase comincia a sentirsi, non quando la scrive. */
function didascalia(testo) {
  const d = $("didascalia");
  d.textContent = testo || "";
  d.classList.toggle("visibile", !!testo);
}

/* Senza voce non c'è niente da comandare: i pulsanti spariscono e l'avviso
   prende il loro posto, invece di lasciarli accesi e morti sotto le dita. */
function segnaVoceMuta(muta) {
  $("muto").classList.toggle("visibile", muta);
  $("racconto").classList.toggle("senza-voce", muta);
}

/* -------------------------------------------------------------- batteria */

function segnaBatteria(tacche) {
  const b = $("batteria");
  b.className = "t" + Math.max(0, Math.min(4, tacche | 0));
}

/* --------------------------------------------------------------- racconto */

let frasi = [];          /* gli span, uno per frase */
let viva = -1;           /* quale è illuminata adesso */

function componiRacconto(elenco) {
  const t = $("r-testo");
  t.innerHTML = "";
  frasi = (elenco || []).map(testo => {
    const s = document.createElement("span");
    s.className = "frase";
    s.textContent = testo + " ";
    t.appendChild(s);
    return s;
  });
  viva = -1;
  t.scrollTop = 0;
  t.classList.remove("scorso");
  ultimaCima = -1;
  frasePartita = { i: -1, t: 0 };
  avanzamento(0);
  segnaCorrezione();
}

function illumina(i) {
  if (i === viva || i < 0 || i >= frasi.length) return;
  if (frasi[viva]) frasi[viva].classList.remove("viva");
  viva = i;
  frasi[viva].classList.add("viva");
  segui(frasi[viva]);
}

/* Il testo scorre dietro alla voce: chi ascolta non deve trascinare nulla.

   La frase viva va al centro della parte che si LEGGE, fra le due sfumature
   della maschera di `.testo` - non al centro della scatola, che continua sotto
   i comandi. Centrata nella scatola, una frase di quattro righe perderebbe
   l'ultima dietro ai pulsanti: proprio quella che dice «questa bottiglia non
   e' nel mio archivio».

   Una frase piu' alta della parte leggibile si mostra dall'inizio, e sale di
   una riga quando la voce arriva alla penultima visibile: si legge sempre la
   riga detta e quella dopo. */
const SFUMA_SU = 34, SFUMA_GIU = 210;        /* gli stessi della maschera */
let ultimaCima = -1;
function segui(el, quota = 0) {
  const t = $("r-testo");
  const box = t.getBoundingClientRect();
  /* La scena e' scalata sul vetro: i rettangoli arrivano in pixel del vetro,
     lo scorrimento si misura in pixel della scena. */
  const k = box.height / t.offsetHeight || 1;
  /* Una riga per rettangolo: uno span che va a capo ne ha uno per riga. */
  const righe = [];
  for (const r of el.getClientRects()) {
    const su = (r.top - box.top) / k + t.scrollTop;
    const giu = (r.bottom - box.top) / k + t.scrollTop;
    const ultima = righe[righe.length - 1];
    if (ultima && Math.abs(ultima.su - su) < 2) ultima.giu = Math.max(ultima.giu, giu);
    else righe.push({ su, giu });
  }
  if (!righe.length) return;
  const sopra = righe[0].su, sotto = righe[righe.length - 1].giu;
  const leggibile = t.clientHeight - SFUMA_SU - SFUMA_GIU;
  let cima;
  if (sotto - sopra <= leggibile) {
    cima = sopra - SFUMA_SU - (leggibile - (sotto - sopra)) / 2;
  } else {
    const detta = Math.min(righe.length - 1, Math.floor(quota * righe.length));
    const fondo = righe[Math.min(righe.length - 1, detta + 1)].giu;
    cima = Math.min(Math.max(sopra, fondo - leggibile), sotto - leggibile) - SFUMA_SU;
  }
  /* Mai piu' giu' di quanto serve a portare in vista la fine del testo: un
     racconto che sta tutto nella parte leggibile non si muove. */
  const ultima = frasi[frasi.length - 1];
  const coda = ultima && ultima.getClientRects();
  if (coda && coda.length) {
    const fine = (coda[coda.length - 1].bottom - box.top) / k + t.scrollTop;
    cima = Math.min(cima, fine - SFUMA_SU - leggibile);
  }
  cima = Math.max(0, Math.round(cima));
  if (Math.abs(cima - ultimaCima) < 2) return;
  ultimaCima = cima;
  t.scrollTo({ top: cima, behavior: "smooth" });
}

/* Dove e' la voce DENTRO la frase. Il riproduttore sa solo a che secondo e'
   arrivato: la durata di una frase la si stima dalle lettere, alla velocita'
   misurata su quelle gia' dette. Serve solo alle frasi piu' alte dello
   schermo, e sbagliare di mezzo secondo vuol dire salire di una riga poco
   prima o poco dopo. */
let lettereAlSecondo = 14;
let frasePartita = { i: -1, t: 0 };
function tieniIlPasso(i, secondi) {
  if (typeof secondi !== "number" || !frasi[i]) return;
  if (i !== frasePartita.i) {
    const prima = frasi[frasePartita.i];
    if (prima && i === frasePartita.i + 1 && secondi - frasePartita.t > 1) {
      const misurata = prima.textContent.length / (secondi - frasePartita.t);
      /* Chi ha toccato «avanti» non ha ascoltato la frase fino in fondo. */
      if (misurata > 8 && misurata < 25) {
        lettereAlSecondo = .7 * lettereAlSecondo + .3 * misurata;
      }
    }
    frasePartita = { i, t: secondi };
    return;
  }
  const quota = (secondi - frasePartita.t) * lettereAlSecondo / frasi[i].textContent.length;
  segui(frasi[i], Math.max(0, Math.min(1, quota)));
}

function avanzamento(quota) {
  $("r-progresso").style.transform = "scaleX(" + Math.max(0, Math.min(1, quota)) + ")";
}

const ICONA_PAUSA = "M6 4h4v16H6zM14 4h4v16h-4z";
const ICONA_PLAY  = "M8 5v14l11-7z";
let inPausa = false;
function segnaPausa(valore) {
  inPausa = valore;
  $("r-icona").firstElementChild.setAttribute("d", valore ? ICONA_PLAY : ICONA_PAUSA);
  $("r-alterna").setAttribute("aria-label", valore ? "Riprendi" : "Pausa");
}

/* ------------------------------------------------------------------ tocco */

/* Un solo posto in cui si decide che cosa è toccabile. Tutto il resto dello
   schermo è inerte di proposito: su un tavolo di ristorante un tocco
   accidentale è la norma, non l'eccezione. */
function rendiToccabile(elemento, azione) {
  elemento.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    elemento.classList.add("premuto");
  });
  for (const evento of ["pointerup", "pointercancel", "pointerleave"]) {
    elemento.addEventListener(evento, () => elemento.classList.remove("premuto"));
  }
  /* Si agisce al RILASCIO, e solo se il dito è ancora sopra: così un tocco
     partito per sbaglio si annulla scivolando via, come su ogni cosa fatta
     bene.

     Il confronto è sul RIQUADRO DI PARTENZA, non su elementFromPoint: mentre
     il dito preme, il pulsante è rimpicciolito al 93% dal ritorno visivo, e
     chiedere "che cosa c'è sotto questo punto" misurerebbe il dito contro un
     bersaglio più piccolo di quello che l'occhio vede. Ne nascerebbe un anello
     morto di quattro pixel tutt'intorno, proprio dove il dito arriva quando
     si tocca senza guardare. */
  elemento.addEventListener("pointerdown", (e) => {
    elemento._riquadro = elemento.getBoundingClientRect();
    try { elemento.setPointerCapture(e.pointerId); } catch { /* poco importa */ }
  });
  elemento.addEventListener("pointerup", (e) => {
    const r = elemento._riquadro;
    if (!r) return;
    const dentro = e.clientX >= r.left && e.clientX <= r.right &&
                   e.clientY >= r.top  && e.clientY <= r.bottom;
    elemento._riquadro = null;
    if (dentro) azione();
  });
}

/* Il filtro anti-rimbalzo è PER AZIONE, e parte da meno infinito: con uno
   zero condiviso, il primo tocco nei primi duecento millesimi di vita della
   pagina verrebbe scartato in silenzio, e "indietro" seguito da "avanti"
   perderebbe il secondo. */
const ultimoComando = {};
function comanda(azione) {
  const ora = performance.now();
  if (ora - (ultimoComando[azione] ?? -Infinity) < 220) return;
  ultimoComando[azione] = ora;

  fetch("/racconto/" + azione, { method: "POST" })
    .then(r => r.json())
    .then(d => {
      /* Il server dice se c'era qualcosa da comandare. Un pulsante che non può
         fare niente si spegne: acceso e inerte è peggio di assente — a racconto
         finito quello che l'ospite cerca è proprio "da capo", e resterebbe lì
         a piena luce senza nemmeno un lampo di rifiuto. */
      spegniComandi(d.ok === false);
      if (d.ok !== false && "in_pausa" in d) segnaPausa(d.in_pausa === true);
    })
    .catch(() => {});

  /* L'icona cambia SUBITO, senza aspettare la risposta: su un tavolo un
     pulsante che risponde fra duecento millesimi sembra rotto. La risposta
     conferma o corregge. */
  if (azione === "alterna")   segnaPausa(!inPausa);
  if (azione === "ricomincia") { segnaPausa(false); avanzamento(0); }
}

function spegniComandi(spenti) {
  document.querySelectorAll("#r-comandi .cmd").forEach(b => { b.disabled = spenti; });
}

document.querySelectorAll("#r-comandi .cmd").forEach(b => {
  rendiToccabile(b, () => comanda(b.dataset.azione));
});

/* --------------------------------------------------------------- volume */

/* Quanto resta aperto senza che nessuno lo tocchi. Quattro secondi e mezzo:
   il tempo di un gesto e un'occhiata, non tanto da restare in mezzo alla
   schermata dopo che ci si è dimenticati di lui. */
const VOLUME_RIPOSO_MS = 4500;
/* Il cursore va a passi di cinque: abbastanza fini da non sentire gli scalini,
   abbastanza larghi perche' un dito che trema non mandi dieci richieste. */
const PASSO_CURSORE = 5;
/* Il binario e il pomello stanno dentro al riquadro con questo margine, in px
   del disegno: e' mezzo pomello, cosi' agli estremi non esce dal bordo. */
const MARGINE_CURSORE = 30;
const LARGHEZZA_CURSORE = 440;

let volume = 100;
let passoVolume = 10;
let chiusuraVolume = null;
/* Mentre il dito trascina, il livello lo decide lui: i messaggi del server
   che confermano un valore di un attimo prima farebbero saltare il pomello
   all'indietro sotto il dito. */
let trascinaVolume = false;

function disegnaVolume(valore) {
  volume = Math.max(0, Math.min(100, Math.round(valore)));
  const c = $("v-cursore");
  c.style.setProperty("--v", volume / 100);
  c.setAttribute("aria-valuenow", String(volume));
  $("volume").classList.toggle("muto", volume <= 0);
  $("volume").classList.toggle("piano", volume > 0 && volume < 50);
}

function rinviaChiusura() {
  clearTimeout(chiusuraVolume);
  chiusuraVolume = setTimeout(chiudiVolume, VOLUME_RIPOSO_MS);
}

function chiudiVolume() {
  clearTimeout(chiusuraVolume);
  $("volume").classList.remove("aperto");
}

function alternaVolume() {
  const aperto = $("volume").classList.toggle("aperto");
  if (aperto) rinviaChiusura(); else clearTimeout(chiusuraVolume);
}

/* Il livello si muove SUBITO e il server lo segue: durante il gesto al
   massimo un invio ogni centosessanta millesimi, e l'ultimo sempre, al
   rilascio. Il colpetto che fa sentire il volume lo decide il server, quando
   la mano si ferma. */
let ultimoInvioVolume = 0;
let invioVolumeRinviato = null;
function inviaVolume(valore, subito) {
  clearTimeout(invioVolumeRinviato);
  const manda = () => {
    ultimoInvioVolume = performance.now();
    fetch("/volume/" + valore, { method: "POST" })
      .then(r => r.json())
      .then(d => { if (!trascinaVolume && typeof d.valore === "number") disegnaVolume(d.valore); })
      .catch(() => {});
  };
  if (subito || performance.now() - ultimoInvioVolume > 160) manda();
  else invioVolumeRinviato = setTimeout(manda, 160);
}

(function preparaCursore() {
  const c = $("v-cursore");
  /* Il punto toccato diventa un livello. Il riquadro misurato e' quello
     SCALATO sul vetro, e il margine si scala con lui: si ragiona in frazioni
     della larghezza, non in pixel del disegno. */
  function livelloDa(x) {
    const r = c.getBoundingClientRect();
    const m = r.width * MARGINE_CURSORE / LARGHEZZA_CURSORE;
    const f = (x - r.left - m) / Math.max(1, r.width - 2 * m);
    return Math.round(Math.max(0, Math.min(1, f)) * 100 / PASSO_CURSORE) * PASSO_CURSORE;
  }
  function muovi(e) {
    const v = livelloDa(e.clientX);
    if (v !== volume) { disegnaVolume(v); inviaVolume(v, false); }
    rinviaChiusura();
  }
  c.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    trascinaVolume = true;
    c.classList.add("trascina");
    try { c.setPointerCapture(e.pointerId); } catch { /* poco importa */ }
    muovi(e);
  });
  c.addEventListener("pointermove", (e) => { if (trascinaVolume) muovi(e); });
  const lascia = () => {
    if (!trascinaVolume) return;
    trascinaVolume = false;
    c.classList.remove("trascina");
    inviaVolume(volume, true);
    rinviaChiusura();
  };
  c.addEventListener("pointerup", lascia);
  c.addEventListener("pointercancel", lascia);
})();

rendiToccabile($("v-apri"), alternaVolume);
/* Rotta a se', non un'azione del racconto: `comanda()` parla con
   `/racconto/<azione>`, e quella rotta non fa NIENTE quando non c'e' un
   riproduttore acceso - cioe' nei secondi dopo la fine, e quando la lingua
   non ha voce. Il pulsante sarebbe morto proprio nei casi in cui serve di
   piu'. */
rendiToccabile($("annulla"), () => fetch("/annulla", { method: "POST" }).catch(() => {}));


/* --------------------------------------------------------------- lingue */

/* Le bandiere si disegnano qui, in SVG, e non con le emoji: su Linux Chromium
   non ha un carattere a colori che le contenga, e 🇮🇹 esce scritto «IT». Il
   Regno Unito e' la meta' centrale della bandiera 2:1, ritagliata a cerchio
   dal suo contenitore. Una lingua che qui non c'e' esce con la sigla. */
const BANDIERE = {
  it: '<svg viewBox="0 0 60 60" aria-hidden="true">' +
      '<rect width="20" height="60" fill="#009246"/>' +
      '<rect x="20" width="20" height="60" fill="#F4F5F0"/>' +
      '<rect x="40" width="20" height="60" fill="#CE2B37"/></svg>',
  en: '<svg viewBox="15 0 30 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
      '<clipPath id="uk-t"><path d="M30,15h30v15zv15h-30zh-30v-15zv-15h30z"/></clipPath>' +
      '<path d="M0,0v30h60v-30z" fill="#012169"/>' +
      '<path d="M0,0L60,30M60,0L0,30" stroke="#fff" stroke-width="6"/>' +
      '<path d="M0,0L60,30M60,0L0,30" clip-path="url(#uk-t)" stroke="#C8102E" stroke-width="4"/>' +
      '<path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/>' +
      '<path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></svg>',
};
/* Il nome di ogni lingua nella sua lingua: e' quello che si legge per
   scegliere, e non si traduce. */
const NOMI_LINGUE = { it: "Italiano", en: "English" };

/* I testi fissi della schermata d'attesa che arrivano col messaggio «lingua». */
function disegnaPassi(passi) {
  if (!Array.isArray(passi) || passi.length !== 3) return;
  passi.forEach((p, i) => {
    if (!p.verbo) return;
    const riga = $("p" + (i + 1));
    const verbo = document.createElement("b");
    verbo.className = "p-verbo";
    verbo.textContent = p.verbo;
    riga.replaceChildren(verbo, document.createTextNode(p.resto ? " " + p.resto : ""));
  });
}

/* L'elenco lo disegna il server: sa quali lingue esistono e come si chiamano
   le scritte fisse. La pagina non tiene un proprio elenco, così aggiungere
   una lingua è un file JSON e nient'altro. */
function disegnaLingue(m) {
  document.documentElement.lang = m.lingua || "it";
  if (m.motto)   $("motto").textContent   = m.motto;
  if (m.avviso_muto) $("muto").textContent = m.avviso_muto;
  disegnaPassi(m.passi);
  /* Il nome del pulsante non e' scritto nella pagina: arriva tradotto come
     tutte le altre scritte fisse. */
  if (m.annulla) $("annulla").setAttribute("aria-label", m.annulla);
  segnaVoceMuta(m.voce_muta === true);

  const box = $("lingue");
  const codici = m.disponibili || [];
  box.innerHTML = "";
  if (codici.length < 2) return;

  codici.forEach(codice => {
    const b = document.createElement("div");
    b.className = "lingua" + (codice === m.lingua ? " corrente" : "");
    b.setAttribute("role", "button");
    b.setAttribute("aria-label", NOMI_LINGUE[codice] || codice);
    b.setAttribute("aria-pressed", String(codice === m.lingua));
    if (BANDIERE[codice]) {
      const f = document.createElement("div");
      f.className = "bandiera";
      f.innerHTML = BANDIERE[codice];
      b.appendChild(f);
    } else {
      const s = document.createElement("span");
      s.className = "sigla";
      s.textContent = codice.toUpperCase();
      b.appendChild(s);
    }
    rendiToccabile(b, () => fetch("/lingua/" + codice, { method: "POST" }).catch(() => {}));
    box.appendChild(b);
  });
}

/* --------------------------------------------------------------- eventi */

const eventi = new EventSource("/eventi");

eventi.onmessage = (e) => {
  let m;
  try { m = JSON.parse(e.data); } catch { return; }

  switch (m.tipo) {
    case "stato":
      if (m.vista === "racconto") {
        azioneCorrezione = m.correzione || null;
        const titolo = m.titolo || "";
        $("r-titolo").textContent = titolo;
        /* I gradini contano le lettere: trentaquattro stanno su una riga al
           corpo pieno, cinquantasei su due al corpo medio, e oltre si scende
           al piccolo invece di troncare. */
        $("r-titolo").dataset.misura =
          titolo.length > 56 ? "lunghissimo" : titolo.length > 34 ? "lungo" : "";
        $("r-sottotitolo").textContent = m.sottotitolo || "";
        /* Il testo si svuota QUI, non quando arriva quello nuovo: fra il
           cambio di vista e la prima frase passa qualche decimo, e in quel
           buco si leggerebbe ancora il vino di prima.
           Ma non quando il racconto e' lo STESSO: la schermata resta accesa
           anche nei due secondi che seguono la fine, e li' non c'e' nessun
           vino di prima da nascondere - c'e' quello che si e' appena
           ascoltato. Svuotandola, l'ospite guarderebbe due secondi di schermo
           vuoto ogni volta che una storia finisce. */
        if (!m.stesso_racconto) componiRacconto([]);
        segnaCorrezione();
      }
      /* L'editor vive dentro alla schermata da cui si e' aperto - il racconto,
         o l'avviso di una bottiglia non riconosciuta: se il dispositivo va
         altrove, si chiude. */
      if (m.vista !== vistaEditor && !$("correzione").hidden) chiudiEditor(false);
      if (m.vista === "lavoro" && m.frase) $("frase-lavoro").textContent = m.frase;
      if (m.vista === "avviso") {
        $("a-frase").textContent = m.frase || "";
        $("a-simbolo").textContent = m.simbolo || "↻";
        /* Il tono lo decide il server, che sa se sta chiedendo qualcosa o
           dichiarando un guasto: un guasto non ha l'oro di un invito. */
        $("avviso").className = "vista " + (m.tono || "invito");
        const aiuta = $("a-aiuta");
        aiuta.hidden = m.aiuta !== true;
        aiuta.querySelector(".scritta").textContent =
          scritte().aiutami || "Mi aiuti a riconoscerla";
      }
      if ("voce_muta" in m) segnaVoceMuta(m.voce_muta === true);
      /* Cambiando scena si tace: una didascalia rimasta accesa parlerebbe di
         una bottiglia che non c'è più. */
      didascalia("");
      /* E il comando del volume si richiude: aperto sopra il titolo di un vino
         appena riconosciuto non ci deve restare. */
      chiudiVolume();
      mostra(m.vista);
      break;

    case "scrivendo": {
      /* Il testo non c'e' ancora e ci vorranno secondi: si dice. La frase
         arriva col messaggio «lingua», che si rimanda a ogni cambio, quindi
         segue la lingua da sola. */
      const t = $("r-testo");
      t.innerHTML = "";
      const s = document.createElement("div");
      s.className = "scrivendo";
      /* Il calice del marchio, copiato: un disegno solo per tutta la pagina. */
      const c = document.querySelector("#attesa .marchio .calice").cloneNode(true);
      c.setAttribute("class", "calicino segno");
      const scritta = document.createElement("span");
      scritta.textContent = parole.sto_scrivendo || "…";
      s.append(c, scritta);
      t.appendChild(s);
      frasi = []; viva = -1; avanzamento(0);
      segnaCorrezione();
      break;
    }

    case "racconto":
      componiRacconto(m.frasi);
      segnaPausa(false);
      spegniComandi(false);
      break;

    case "riproduzione":
      illumina(m.frase || 0);
      tieniIlPasso(m.frase || 0, m.posizione);
      segnaPausa(m.in_pausa === true);
      /* La quota la calcola il server, che e' l'unico a sapere quanto dura
         il racconto INTERO. Qui si sa solo «quanto e' gia' sintetizzato»:
         dividendo la posizione per quello, il denominatore crescerebbe sotto
         i piedi del numeratore e la barra tornerebbe indietro a ogni frase
         nuova. */
      if (typeof m.quota === "number") avanzamento(m.quota);
      break;

    case "didascalia":
      didascalia(m.testo);
      break;

    case "lingua":
      disegnaLingue(m);
      parole.sto_scrivendo = m.sto_scrivendo || "";
      parole.correzione = m.correzione || {};
      segnaCorrezione();
      if (m.impostazioni) {
        $("i-titolo").textContent = m.impostazioni.impostazioni;
        $("i-modo-titolo").textContent = m.impostazioni.modo_titolo;
        for (const nome of ["archivio", "generativa", "carta"]) {
          const riga = $("i-modo-" + nome);
          riga.querySelector(".i-nome").textContent =
            m.impostazioni["modo_" + nome];
          riga.querySelector(".i-spiega").textContent =
            m.impostazioni["modo_" + nome + "_spiega"];
        }
        $("i-mirino-nome").textContent = m.impostazioni.mirino;
        $("i-correzioni-nome").textContent = m.impostazioni.aggiungi_correzioni;
        $("i-ripristina-nome").textContent = m.impostazioni.ripristina;
        $("i-ripristina-spiega").textContent = m.impostazioni.ripristina_spiega;
        $("i-correzioni-spiega").textContent = m.impostazioni.aggiungi_correzioni_spiega;
        $("i-mirino-spiega").textContent = m.impostazioni.mirino_spiega;
        $("m-torna").textContent = m.impostazioni.mirino_torna;
        parole.mirino = { legge: m.impostazioni.mirino_legge,
                          trova: m.impostazioni.mirino_trova,
                          niente: m.impostazioni.mirino_niente };
        $("i-stato-nome").textContent = m.impostazioni.stato_tecnico;
        $("i-batteria-nome").textContent = m.impostazioni.batteria_ricaricata;
        $("i-batteria-spiega").textContent = m.impostazioni.batteria_spiega;
        $("i-chiudi").setAttribute("aria-label", m.impostazioni.chiudi);
        $("d-chiudi").textContent = m.impostazioni.chiudi;
      }
      break;

    case "volume":
      /* Senza voce del tutto — il dispositivo avviato con --senza-voce — il
         comando non c'è: un livello che non muove niente è peggio di nessun
         livello. */
      $("volume").hidden = m.attivo === false;
      if (typeof m.passo === "number") passoVolume = m.passo;
      if (typeof m.valore === "number" && !trascinaVolume) disegnaVolume(m.valore);
      break;

    case "impostazioni":
      disegnaImpostazioni(m);
      if (m.batteria) segnaBatteria(m.batteria.tacche);
      break;

    case "mirino":
      disegnaMirino(m);
      break;

    case "correzione":
      /* Il server chiude l'editor quando e' rimasto aperto troppo a lungo, o
         quando l'interruttore delle correzioni si spegne. */
      if (m.aperta === false) chiudiEditor(false);
      /* E dice quale pulsante mostrare quando l'interruttore cambia con un
         racconto a schermo: il racconto non si ridisegna. */
      if ("azione" in m) { azioneCorrezione = m.azione || null; segnaCorrezione(); }
      break;

    case "salute":
      $("spia").classList.toggle("rotto", !m.tutto_bene);
      segnaVoceMuta(m.voce_muta === true);
      if (m.batteria) segnaBatteria(m.batteria.tacche);
      break;
  }
};

/* Se il server cade, EventSource riprova da solo. Si segnala e basta: un
   riavvio della pagina perderebbe il racconto in corso. */
eventi.onerror = () => $("spia").classList.add("rotto");

/* Lo stato tecnico, da leggere senza tastiera. Si APRE sopra la scena e
   non ci si naviga: andarsene da questa pagina, su un chiosco senza barra degli
   indirizzi, significa non tornare più indietro e perdere il flusso di eventi.

   Tre secondi fermi, con una tolleranza di movimento. Senza la tolleranza il
   gesto sarebbe rovesciato: il centro del contatto su un capacitivo non
   calibrato oscilla di continuo, quindi non si completerebbe mai per chi lo
   cerca — e potrebbe completarsi da solo sotto una mano appoggiata immobile
   sul bordo. */
const ANGOLO_TENUTA = 3000;
const ANGOLO_SCARTO = 30;
let gesto = null;

function annullaGesto() {
  if (gesto) { clearTimeout(gesto.t); gesto = null; }
}

function apriImpostazioni() {
  gesto = null;
  $("impostazioni").hidden = false;
}

function apriDiagnostica() {
  $("d-corpo").textContent = "…";
  fetch("/stato").then(r => r.json())
    .then(d => { $("d-corpo").textContent = JSON.stringify(d, null, 2); })
    .catch(e => { $("d-corpo").textContent = "stato non leggibile: " + e; });
  $("diagnostica").hidden = false;
}

/* I modi di raccontare. `modiServibili` sono quelli che il server dice di
   poter servire: senza modello, la riga delle descrizioni generate non si
   mostra affatto. */
const MODI = ["archivio", "generativa", "carta"];
let modoScelto = "archivio";
let modiServibili = MODI.slice();

let correzioniAttive = false;

function disegnaImpostazioni(m) {
  if (typeof m.correzioni === "boolean") correzioniAttive = m.correzioni;
  $("i-correzioni").classList.toggle("acceso", correzioniAttive);
  $("i-correzioni").setAttribute("aria-pressed", String(correzioniAttive));
  if (typeof m.modo === "string") modoScelto = m.modo;
  if (Array.isArray(m.modi)) modiServibili = m.modi;
  for (const nome of MODI) {
    const riga = $("i-modo-" + nome);
    riga.hidden = !modiServibili.includes(nome);
    riga.classList.toggle("acceso", nome === modoScelto);
    riga.setAttribute("aria-pressed", String(nome === modoScelto));
  }
}

(function preparaImpostazioni() {
  for (const nome of MODI) {
    rendiToccabile($("i-modo-" + nome), () => {
      /* Si disegna subito e si chiede dopo: al tocco la scelta deve muoversi,
         non aspettare la rete. Se la richiesta fallisce o il server rifiuta,
         il messaggio di ritorno rimette le cose come stanno. */
      const prima = modoScelto;
      modoScelto = nome;
      disegnaImpostazioni({});
      fetch("/modo/" + nome, { method: "POST" })
        .then(r => r.json())
        .then(d => { if (!d.ok) modoScelto = prima; disegnaImpostazioni(d); })
        .catch(() => { modoScelto = prima; disegnaImpostazioni({}); });
    });
  }
  rendiToccabile($("i-mirino"), () => chiediMirino(!mirinoAcceso));
  /* «Aggiungi correzioni»: come il modo, si disegna subito e si chiede dopo. */
  rendiToccabile($("i-correzioni"), () => {
    const prima = correzioniAttive;
    disegnaImpostazioni({ correzioni: !prima });
    fetch("/correzioni/" + (prima ? 0 : 1), { method: "POST" })
      .then(r => r.json())
      .then(disegnaImpostazioni)
      .catch(() => disegnaImpostazioni({ correzioni: prima }));
  });
  rendiToccabile($("i-stato"), apriDiagnostica);
  /* «Ripristina il funzionamento»: quello che altrimenti si otterrebbe solo
     staccando la corrente. Il server ci mette fino a qualche secondo. */
  let ripristinando = false;
  rendiToccabile($("i-ripristina"), () => {
    if (ripristinando) return;
    ripristinando = true;
    const riga = $("i-ripristina");
    riga.classList.add("in-corso");
    fetch("/ripristina", { method: "POST" })
      .then(r => r.json())
      .then(d => {
        riga.classList.remove("in-corso");
        if (!d.ok) return;
        riga.classList.add("fatto");
        setTimeout(() => {
          riga.classList.remove("fatto");
          $("impostazioni").hidden = true;
        }, 1200);
      })
      .catch(() => riga.classList.remove("in-corso"))
      .finally(() => { ripristinando = false; });
  });
  /* «Batteria ricaricata»: la stima riparte da piena, e il segno di spunta
     resta acceso un attimo per dire che il tocco e' arrivato. */
  rendiToccabile($("i-batteria"), () => {
    fetch("/batteria/ricaricata", { method: "POST" })
      .then(r => r.json())
      .then(d => {
        // Il ritorno del tocco e' l'icona stessa che torna a quattro tacche.
        if (typeof d.tacche === "number") segnaBatteria(d.tacche);
      })
      .catch(() => {});
  });
  rendiToccabile($("i-chiudi"), () => { $("impostazioni").hidden = true; });
})();

/* --------------------------------------------------------------- mirino */

/* Il mirino: il dispositivo smette di raccontare e mostra cosa vede la camera,
   con sopra il riquadro che va all'OCR e la nitidezza misurata dentro di lui.
   Si accende dal pannello e si spegne da li' o dal pulsante grande, che e'
   l'unico modo di tornare indietro quando il pannello non si vede piu'.

   Il video e' un multipart che il browser tiene aperto: quando si spegne, il
   src va SVUOTATO. Lasciarlo vuol dire una connessione appesa per sempre a un
   flusso che non manda piu' niente, e al riaccendersi il browser mostrerebbe
   l'ultimo fotogramma della volta prima come se fosse adesso. */
let mirinoAcceso = false;
let mirinoOrologio = null;
/* Quante righe si mostrano. Un'etichetta ne da' tre o cinque; una parete con
   un calendario dietro ne da' quaranta, e mostrarle tutte spinge fuori
   schermo la cosa per cui si e' aperto il mirino. Le altre si contano. */
const RIGHE_MOSTRATE = 10;

function chiediMirino(acceso) {
  fetch("/mirino/" + (acceso ? 1 : 0), { method: "POST" })
    .then(r => r.json())
    .then(disegnaMirino)
    .catch(() => { /* il messaggio di stato rimettera' le cose a posto */ });
}

function disegnaMirino(m) {
  if (typeof m.acceso !== "boolean") return;
  mirinoAcceso = m.acceso;
  if (typeof m.disponibile === "boolean") $("i-mirino").hidden = !m.disponibile;
  $("i-mirino").classList.toggle("acceso", mirinoAcceso);
  $("i-mirino").setAttribute("aria-pressed", String(mirinoAcceso));
  $("mirino").hidden = !mirinoAcceso;
  if (mirinoAcceso) {
    $("impostazioni").hidden = true;
    $("diagnostica").hidden = true;
    $("m-video").src = "/mirino/flusso?" + Date.now();
    aggiornaLettura();
    if (!mirinoOrologio) mirinoOrologio = setInterval(aggiornaLettura, 1200);
  } else {
    $("m-video").removeAttribute("src");
    if (mirinoOrologio) { clearInterval(mirinoOrologio); mirinoOrologio = null; }
  }
}

const sicuro = (s) => String(s).replace(/[<&]/g, c => c === "<" ? "&lt;" : "&amp;");

function aggiornaLettura() {
  fetch("/mirino/lettura", { cache: "no-store" })
    .then(r => r.json())
    .then(d => {
      const e = $("m-corpo");
      const p = parole.mirino || {};
      if (d.stato !== "letto") {
        e.innerHTML = "<p class=fioco>" + sicuro(d.stato) + "</p>";
        return;
      }
      const cl = d.fascia || "nulla";
      e.innerHTML =
        "<h3>" + sicuro(p.legge || "Cosa legge") + " · " + d.durata + " s</h3>" +
        (d.righe.length
          ? "<ul>" + d.righe.slice(0, RIGHE_MOSTRATE).map(r =>
              "<li><code>" + sicuro(r) + "</code></li>").join("") + "</ul>" +
            (d.righe.length > RIGHE_MOSTRATE
              ? "<p class=fioco>e altre " + (d.righe.length - RIGHE_MOSTRATE) + "</p>"
              : "")
          : "<p class=fioco>" + sicuro(p.niente || "—") + "</p>") +
        "<h3>" + sicuro(p.trova || "Cosa trova") + "</h3>" +
        "<p><b class=" + cl + ">" + sicuro(d.livello) + "</b> · " + d.sicurezza + "</p>" +
        (d.nome ? "<p><b>" + sicuro(d.nome) + "</b><br>" + sicuro(d.cantina) +
           (d.annata ? " · " + sicuro(d.annata) : "") + "</p>" : "") +
        (d.candidati.length ? "<ul>" + d.candidati.map(c =>
           "<li>" + sicuro(c) + "</li>").join("") + "</ul>" : "") +
        "<p class=fioco>nitidezza " + d.nitidezza + " · posa " + d.posa + "</p>";
    })
    .catch(() => { /* la board sta rispondendo a qualcos'altro */ });
}

(function preparaMirino() {
  rendiToccabile($("m-torna"), () => chiediMirino(false));
})();

(function preparaAngolo() {
  const a = $("angolo");
  a.addEventListener("pointerdown", (e) => {
    try { a.setPointerCapture(e.pointerId); } catch { /* poco importa */ }
    gesto = { id: e.pointerId, x: e.clientX, y: e.clientY,
              t: setTimeout(apriImpostazioni, ANGOLO_TENUTA) };
  });
  a.addEventListener("pointermove", (e) => {
    if (!gesto || e.pointerId !== gesto.id) return;
    if (Math.abs(e.clientX - gesto.x) > ANGOLO_SCARTO ||
        Math.abs(e.clientY - gesto.y) > ANGOLO_SCARTO) annullaGesto();
  });
  /* pointercancel è il caso che conta: il browser lo manda quando si prende
     il tocco per un gesto suo, e senza di lui il pointerup non arriva mai. */
  a.addEventListener("pointerup", annullaGesto);
  a.addEventListener("pointercancel", annullaGesto);
  document.addEventListener("visibilitychange", annullaGesto);
  /* Si torna alle impostazioni, non allo schermo del tavolo: chi e' entrato
     per guardare lo stato di solito vuole anche l'interruttore. */
  rendiToccabile($("d-chiudi"), () => { $("diagnostica").hidden = true; });
})();

/* ------------------------------------------------------------- correzione */

/* Quale pulsante offrire. Lo decide il server - «correggi» sulla bottiglia
   fuori archivio, «modifica» su una gia' corretta - e arriva col messaggio di
   stato; si accende quando arriva il testo, e resta acceso a racconto finito. */
let azioneCorrezione = null;

function segnaCorrezione() {
  const b = $("r-correggi");
  const c = parole.correzione || {};
  b.hidden = !azioneCorrezione || !frasi.length;
  b.querySelector(".scritta").textContent = azioneCorrezione === "modifica"
    ? (c.modifica_descrizione || "Modifica la descrizione")
    : (c.correggi_descrizione || "Correggi la descrizione");
}

/* --- L'editor ------------------------------------------------------------ */

let campoAttivo = "titolo";
let idScelto = null;            /* la correzione a cui si aggiunge, se c'e' */
let idIniziale = null;          /* quella che si stava modificando aprendo */
/* Il vino a cui la bottiglia sara' collegata: quello riconosciuto, o quello
   scelto fra le proposte. `null` con `scollegata` vuol dire «tolto a mano». */
let rifScelto = null;
let scollegata = false;
let titoloScelto = "";          /* il titolo com'era quando si e' scelto */
/* La schermata da cui l'editor si e' aperto: il racconto, o l'avviso. */
let vistaEditor = "racconto";
/* Si sta scrivendo la descrizione nell'altra lingua: titolo e collegamento
   sono gia' decisi, e il titolo non si cerca fra le bottiglie. */
let secondaLingua = false;

function scritte() { return parole.correzione || {}; }

function nota(testo, errore) {
  const n = $("k-nota");
  n.innerHTML = "";
  n.textContent = testo || "";
  n.classList.toggle("errore", !!errore);
  n.classList.remove("fatto");
}

function apriEditor() {
  fetch("/correzione/apri", { method: "POST" })
    .then(r => r.json())
    .then(d => {
      if (!d.ok) return;
      const s = scritte();
      idScelto = idIniziale = d.id || null;
      rifScelto = d.riferimento || null;
      scollegata = false;
      secondaLingua = false;
      titoloScelto = d.titolo || "";
      vistaEditor = d.aiuto ? "avviso" : "racconto";
      $("k-domanda").hidden = true;
      $("k-titolo-editor").textContent = d.aiuto
        ? (s.aiutami || "Mi aiuti a riconoscerla")
        : d.id
        ? (s.modifica_descrizione || "Modifica la descrizione")
        : (s.correggi_descrizione || "Correggi la descrizione");
      $("k-salva").textContent = s.salva || "Salva";
      if (s.annulla) $("k-chiudi").setAttribute("aria-label", s.annulla);
      $("k-titolo").placeholder = s.campo_titolo || "Titolo";
      $("k-descrizione").placeholder = s.campo_descrizione || "Descrizione";
      $("k-titolo").value = d.titolo || "";
      $("k-descrizione").value = d.descrizione || "";
      $("k-foto").src = "/correzione/foto/adesso?" + Date.now();
      for (const c of document.querySelectorAll(".k-campo")) c.classList.remove("vuoto");
      nascondiProposte();
      if (Array.isArray(d.vicine) && d.vicine.length) disegnaVicine(d.vicine);
      else notaDiRiposo();
      segnaSegnaposto();
      $("correzione").hidden = false;
      /* Si riparte dalle lettere: chi aveva lasciato i numeri o le maiuscole
         fisse la volta prima non se lo ricorda. */
      strato = LETTERE; maiuscola = false; maiuscoleFisse = false;
      disegnaTastiera();
      attiva(d.titolo ? "descrizione" : "titolo");
    })
    .catch(() => {});
}

/* Una bottiglia gia' corretta che stavolta non si e' riconosciuta: si propone,
   con la sua foto, e toccarla vuol dire «e' lei». */
function disegnaVicine(vicine) {
  const n = $("k-nota");
  n.innerHTML = "";
  n.classList.remove("errore", "fatto");
  const d = document.createElement("span");
  d.textContent = scritte().correzione_vicine || "";
  n.appendChild(d);
  for (const v of vicine) {
    const b = document.createElement("div");
    b.className = "k-vicina";
    const f = document.createElement("img");
    f.src = "/correzione/foto/" + encodeURIComponent(v.id);
    f.alt = "";
    const t = document.createElement("span");
    t.textContent = v.titolo;
    b.append(f, t);
    rendiToccabile(b, () => {
      const scelta = !b.classList.contains("scelta");
      document.querySelectorAll(".k-vicina").forEach(x => x.classList.remove("scelta"));
      b.classList.toggle("scelta", scelta);
      idScelto = scelta ? v.id : null;
      if (scelta) {
        $("k-titolo").value = v.titolo || "";
        if (v.descrizione) $("k-descrizione").value = v.descrizione;
        attiva("descrizione");
      }
    });
    n.appendChild(b);
  }
}

/* La riga sotto la barra quando non si stanno cercando nomi: il vino
   collegato, con la crocetta per toglierlo, o la spiegazione. */
function notaDiRiposo() {
  const s = scritte();
  if (!rifScelto) { nota(s.correzione_spiega || ""); return; }
  const n = $("k-nota");
  n.innerHTML = "";
  n.classList.remove("errore", "fatto");
  const t = document.createElement("span");
  t.className = "k-collegata";
  t.textContent = (s.correzione_collegata || "Collegata a") + ": " + rifScelto.titolo;
  const x = document.createElement("div");
  x.className = "k-scollega";
  x.setAttribute("role", "button");
  x.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 ' +
    '10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';
  rendiToccabile(x, () => {
    rifScelto = null; scollegata = true;
    notaDiRiposo(); segnaSegnaposto();
  });
  n.append(t, x);
}

/* Con un vino collegato la descrizione e' facoltativa, e il campo lo dice. */
function segnaSegnaposto() {
  const s = scritte();
  $("k-descrizione").placeholder = rifScelto
    ? (s.descrizione_facoltativa || s.campo_descrizione || "Descrizione")
    : (s.campo_descrizione || "Descrizione");
}

/* Mentre si scrive il titolo si propongono le bottiglie che il dispositivo
   conosce - quelle gia' corrette, la carta, l'archivio - e toccarne una vuol
   dire «e' questa». Si chiede al server poco dopo l'ultima lettera, non a
   ogni lettera: chi scrive in fretta farebbe partire dieci richieste per
   vederne una. */
let ritardoProposte = null;
let ultimaRichiesta = 0;
let proposte = [];              /* tutte quelle arrivate, fino a venti */
let paginaProposte = 0;
const PER_PAGINA = 5;           /* piu' «Nessuna di queste»: sei caselle */

function proponi() {
  clearTimeout(ritardoProposte);
  /* Nell'altra lingua il vino e' gia' scelto: il titolo e' solo un nome. */
  if (secondaLingua) return;
  ritardoProposte = setTimeout(() => {
    const q = $("k-titolo").value.trim();
    if (q.length < 2) { nascondiProposte(); return; }
    const questa = ++ultimaRichiesta;
    fetch("/correzione/cerca?q=" + encodeURIComponent(q))
      .then(r => r.json())
      .then(lista => {
        /* Una risposta arrivata dopo un'altra piu' recente non vale piu', e
           nemmeno una arrivata quando si e' gia' passati alla descrizione. */
        if (questa !== ultimaRichiesta || campoAttivo !== "titolo") return;
        mostraProposte(Array.isArray(lista) ? lista : []);
      })
      .catch(() => {});
  }, 200);
}

function mostraProposte(lista) {
  proposte = lista;
  paginaProposte = 0;
  if (!lista.length) { nascondiProposte(); return; }
  disegnaPagina();
}

function casella(titolo, sotto, classe) {
  const b = document.createElement("div");
  b.className = "k-opzione" + (classe ? " " + classe : "");
  b.setAttribute("role", "button");
  const t = document.createElement("span");
  t.className = "t";
  t.textContent = titolo;
  const f = document.createElement("span");
  f.className = "f";
  f.textContent = sotto || "";
  b.append(t, f);
  return b;
}

function disegnaPagina() {
  const s = scritte();
  const box = $("k-proposte");
  box.innerHTML = "";
  const da = paginaProposte * PER_PAGINA;
  for (const p of proposte.slice(da, da + PER_PAGINA)) {
    const b = casella(p.titolo, p.sotto);
    rendiToccabile(b, () => scegliProposta(p));
    box.appendChild(b);
  }
  /* L'ultima casella dice anche cosa succede toccandola: quante ne restano,
     o che si passa a scrivere. */
  const resto = proposte.length - (da + PER_PAGINA);
  const n = casella(s.nessuna_di_queste || "Nessuna di queste",
                    resto > 0 ? (s.altre_proposte || "altre {n}").replace("{n}", resto)
                              : (s.nessuna_scrivo_io || ""),
                    "nessuna");
  rendiToccabile(n, () => {
    if (resto > 0) { paginaProposte++; disegnaPagina(); return; }
    nascondiProposte();
    attiva("descrizione");
  });
  box.appendChild(n);
  $("k-descrizione").hidden = true;
  box.hidden = false;
}

function nascondiProposte() {
  $("k-proposte").hidden = true;
  $("k-descrizione").hidden = false;
}

function scegliProposta(p) {
  $("k-titolo").value = p.titolo;
  titoloScelto = p.titolo;
  if (p.tipo === "correzione") {
    /* Una bottiglia gia' corretta: questa foto si aggiunge alla sua. */
    idScelto = p.id;
    rifScelto = null;
    if (p.descrizione && !$("k-descrizione").value.trim()) {
      $("k-descrizione").value = p.descrizione;
    }
  } else {
    idScelto = idIniziale;
    rifScelto = p.tipo === "carta"
      ? { tipo: "carta", titolo: p.titolo }
      : { tipo: "archivio", ambito: p.ambito, id: p.id, titolo: p.titolo };
    scollegata = false;
  }
  $("k-titolo").classList.remove("vuoto");
  nascondiProposte();
  notaDiRiposo();
  segnaSegnaposto();
  attiva("descrizione");
}

/* Il titolo cambiato a mano dopo una scelta non e' piu' quella scelta. */
function titoloToccato() {
  if (titoloScelto && $("k-titolo").value !== titoloScelto) {
    if (rifScelto) { rifScelto = null; scollegata = true; segnaSegnaposto(); }
    idScelto = idIniziale;
    titoloScelto = "";
    notaDiRiposo();
  }
  proponi();
}

function chiudiEditor(avvisa) {
  fermaRipetizione();
  clearTimeout(ritardoProposte);
  nascondiProposte();
  secondaLingua = false;
  $("k-domanda").hidden = true;
  $("k-salva").classList.remove("nascosto");
  $("correzione").hidden = true;
  document.activeElement && document.activeElement.blur();
  if (avvisa) fetch("/correzione/chiudi", { method: "POST" }).catch(() => {});
}

let salvando = false;

function salvaEditor() {
  if (salvando) return;
  const s = scritte();
  const titolo = $("k-titolo").value.trim();
  const descrizione = $("k-descrizione").value.trim();
  $("k-titolo").classList.toggle("vuoto", !titolo);
  $("k-descrizione").classList.toggle("vuoto", !descrizione && !rifScelto && !idScelto);
  if (!titolo) { nota(s.titolo_vuoto || "", true); attiva("titolo"); return; }
  if (!descrizione && !rifScelto && !idScelto) {
    nota(s.descrizione_vuota || "", true); attiva("descrizione"); return;
  }
  salvando = true;
  $("k-salva").classList.add("in-corso");
  const libera = () => { salvando = false; $("k-salva").classList.remove("in-corso"); };
  fetch("/correzione/salva", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ titolo, descrizione, id: idScelto,
                           riferimento: rifScelto, scollega: scollegata && !rifScelto }),
  })
    .then(r => r.json())
    .then(d => {
      if (d.ok) {
        /* Si dice che e' fatto prima di chiudere: dietro, intanto, la voce
           ha gia' cominciato a leggere la descrizione nuova. */
        nota(s.correzione_salvata || "");
        $("k-nota").classList.add("fatto");
        if (d.altra_lingua) {
          /* Scritta una descrizione, si chiede se la si vuole anche
             nell'altra lingua: il racconto aspetta la risposta. */
          setTimeout(() => { libera(); chiediAltraLingua(d.domanda); }, 700);
          return;
        }
        setTimeout(() => { chiudiEditor(false); libera(); }, 900);
        return;
      }
      libera();
      if (d.campo) {
        $("k-" + d.campo).classList.add("vuoto");
        nota(d.campo === "titolo" ? s.titolo_vuoto : s.descrizione_vuota, true);
        attiva(d.campo);
      } else {
        nota(d.motivo || "", true);
      }
    })
    .catch(libera);
}

function chiediAltraLingua(domanda) {
  const s = scritte();
  fermaRipetizione();
  $("k-d-frase").textContent = domanda || "";
  $("k-d-si").textContent = s.si_scrivo || "Sì";
  $("k-d-no").textContent = s.no_grazie || "No";
  $("k-domanda").hidden = false;
  /* Salvato e' gia' salvato: il pulsante sparirebbe comunque dietro la
     risposta, e toccarlo adesso non avrebbe niente da salvare. */
  $("k-salva").classList.add("nascosto");
  document.activeElement && document.activeElement.blur();
}

let rispondendo = false;

function rispondiAltraLingua(accetta) {
  if (rispondendo) return;
  rispondendo = true;
  fetch("/correzione/altra_lingua", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ accetta }),
  })
    .then(r => r.json())
    .then(d => {
      rispondendo = false;
      if (!accetta || !d.ok) { chiudiEditor(false); return; }
      /* Stessa bottiglia, altra lingua: il titolo di solito non si traduce,
         e la descrizione che c'era gia', se c'era, si ritrova. */
      secondaLingua = true;
      idScelto = d.id; rifScelto = null; scollegata = false; titoloScelto = "";
      $("k-titolo-editor").textContent = d.titolo_editor || "";
      $("k-titolo").value = d.titolo || "";
      $("k-descrizione").value = d.descrizione || "";
      for (const c of document.querySelectorAll(".k-campo")) c.classList.remove("vuoto");
      nascondiProposte();
      nota("");
      segnaSegnaposto();
      $("k-domanda").hidden = true;
      $("k-salva").classList.remove("nascosto");
      attiva("descrizione");
    })
    .catch(() => { rispondendo = false; chiudiEditor(false); });
}

function attiva(nome, alFondo = true) {
  if (nome !== "titolo") { clearTimeout(ritardoProposte); nascondiProposte(); }
  campoAttivo = nome;
  for (const c of document.querySelectorAll(".k-campo")) {
    c.classList.toggle("attivo", c.id === "k-" + nome);
  }
  const campo = $("k-" + nome);
  /* Il fuoco serve al cursore: la tastiera del sistema non c'e' (inputmode
     none), ma senza fuoco non si vedrebbe dove si sta scrivendo. */
  campo.focus({ preventScroll: true });
  /* Aprendo, o passando al campo dopo, il cursore va in fondo. Sotto il dito
     no: li' lo mette il browser dove si e' toccato. */
  if (alFondo) campo.setSelectionRange(campo.value.length, campo.value.length);
  aggiornaMaiuscola();
}

/* --- La tastiera --------------------------------------------------------- */

/* Italiana: le accentate stanno sui tasti, non dietro una pressione lunga che
   su un tavolo nessuno scoprirebbe. L'apostrofo e' in prima fila - in
   italiano si scrive ogni tre parole - e il punto e la virgola accanto allo
   spazio. */
const LETTERE = [
  ["q", "w", "e", "r", "t", "y", "u", "i", "o", "p", "è"],
  ["a", "s", "d", "f", "g", "h", "j", "k", "l", "ò", "à"],
  ["⇧", "z", "x", "c", "v", "b", "n", "m", "ù", "ì", "⌫"],
  ["?123", ",", "'", "␣", ".", "é", "↵"],
];
const SIMBOLI = [
  ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "°"],
  ["-", "/", ":", ";", "(", ")", "€", "%", "&", "«", "»"],
  ["+", "=", "\"", "!", "?", "@", "#", "*", "·", "–", "⌫"],
  ["ABC", ",", "'", "␣", ".", "…", "↵"],
];
const CANCELLA = '<svg viewBox="0 0 24 24"><path d="M22 3H7c-.69 0-1.23.35-1.59.88' +
  'L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59' +
  'L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 ' +
  '8.41 15.41 12 19 15.59z"/></svg>';
/* Come su ogni telefono: la freccia vuota scrive minuscolo, piena scrive la
   prossima lettera maiuscola, piena e sottolineata le scrive tutte. Disegnata
   e non scritta: il carattere ⇧ il Garamond non ce l'ha, e uscirebbe da un
   altro carattere, sottile e piu' piccolo delle due icone accanto. */
const MAIUSCOLA = {
  spenta: '<svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2.5 21.5 12.5H16V20H8' +
    'v-7.5H2.5L12 2.5zm0 3L7 10.5h3V18h4v-7.5h3L12 5.5z"/></svg>',
  accesa: '<svg viewBox="0 0 24 24"><path d="M12 2.5 21.5 12.5H16V20H8v-7.5H2.5z"/></svg>',
  fissa: '<svg viewBox="0 0 24 24"><path d="M12 1 21.5 11H16v6H8v-6H2.5zM8 19h8v2.5H8z"/></svg>',
};
const A_CAPO = '<svg viewBox="0 0 24 24"><path d="M19 7v4H5.83l3.58-3.59L8 6l-6 6 6 6 ' +
  '1.41-1.41L5.83 13H21V7z"/></svg>';

let strato = LETTERE;
let maiuscola = false;          /* la prossima lettera, e basta */
let maiuscoleFisse = false;     /* doppio tocco sul tasto delle maiuscole */
let ultimoShift = 0;
let ripetizione = null;         /* il cancella tenuto premuto: uno solo per tutta la tastiera */

function fermaRipetizione() {
  clearTimeout(ripetizione);
  clearInterval(ripetizione);
  ripetizione = null;
}

/* I tasti si costruiscono una volta per strato - lettere o simboli - e poi se
   ne cambiano solo le scritte. Non si ricostruiscono a ogni cambio di
   maiuscola, perche' la maiuscola cambia anche SOTTO il dito: un tocco su ⌫
   che svuota il campo la riaccende. Ricostruendo, il tasto premuto
   sparirebbe, il dito si alzerebbe su quello nuovo, e il ripetitore del
   vecchio - avviato dopo 450 ms - non lo fermerebbe nessuno: tutto quello che
   si scrive sparirebbe settanta millesimi dopo, come se il cancella restasse
   sempre premuto. */
function disegnaTastiera() {
  fermaRipetizione();
  const box = $("tastiera");
  box.innerHTML = "";
  for (const riga of strato) {
    const r = document.createElement("div");
    r.className = "t-riga";
    for (const t of riga) {
      const k = document.createElement("div");
      k.className = "tasto";
      k.dataset.tasto = t;
      if (t === "⌫") { k.classList.add("servizio"); k.innerHTML = CANCELLA; }
      else if (t === "↵") { k.classList.add("servizio"); k.innerHTML = A_CAPO; }
      else if (t === "⇧" || t === "?123" || t === "ABC") {
        k.classList.add("servizio");
        if (t !== "⇧") k.textContent = t;
      } else if (t === "␣") {
        k.classList.add("largo");
        k.textContent = scritte().tasto_spazio || "spazio";
      }
      premiTasto(k, t);
      r.appendChild(k);
    }
    box.appendChild(r);
  }
  aggiornaTasti();
}

/* Maiuscole o minuscole: si riscrivono le lettere e la freccia, e basta. */
function aggiornaTasti() {
  const su = maiuscola || maiuscoleFisse;
  for (const k of document.querySelectorAll("#tastiera .tasto")) {
    const t = k.dataset.tasto;
    if (t === "⇧") {
      k.innerHTML = MAIUSCOLA[maiuscoleFisse ? "fissa" : maiuscola ? "accesa" : "spenta"];
      k.classList.toggle("acceso", su);
    } else if (t.length === 1 && !"⌫↵␣".includes(t)) {
      k.textContent = su ? t.toUpperCase() : t;
    }
  }
}

/* Un tasto agisce alla PRESSIONE, non al rilascio come i pulsanti: su una
   tastiera il rilascio aggiunge un ritardo che si sente a ogni lettera. Il
   dito che scivola via non annulla niente - come su ogni tastiera. Il tasto
   che cancella, tenuto premuto, continua a cancellare; smette appena un dito
   si alza, dovunque si alzi, e quando non c'e' piu' niente da cancellare. */
function premiTasto(k, t) {
  k.addEventListener("pointerdown", (e) => {
    e.preventDefault();          /* il fuoco resta nel campo */
    fermaRipetizione();
    k.classList.add("premuto");
    batti(t);
    if (t === "⌫") {
      ripetizione = setTimeout(() => {
        ripetizione = setInterval(() => {
          if (!k.isConnected || !batti("⌫")) fermaRipetizione();
        }, 70);
      }, 450);
    }
  });
  const lascia = () => {
    k.classList.remove("premuto");
    if (t === "⌫") fermaRipetizione();
  };
  for (const ev of ["pointerup", "pointercancel", "pointerleave"]) {
    k.addEventListener(ev, lascia);
  }
}
for (const ev of ["pointerup", "pointercancel"]) {
  window.addEventListener(ev, fermaRipetizione, true);
}

function batti(t) {
  const campo = $("k-" + campoAttivo);
  if (t === "⇧") {
    const ora = performance.now();
    if (ora - ultimoShift < 350) { maiuscoleFisse = !maiuscoleFisse; maiuscola = false; }
    else { maiuscola = !maiuscola; if (maiuscoleFisse) { maiuscoleFisse = false; maiuscola = false; } }
    ultimoShift = ora;
    aggiornaTasti();
    return true;
  }
  if (t === "?123") { strato = SIMBOLI; disegnaTastiera(); return true; }
  if (t === "ABC") { strato = LETTERE; disegnaTastiera(); aggiornaMaiuscola(); return true; }
  let fatto = true;
  if (t === "↵") {
    if (campoAttivo === "titolo") { attiva("descrizione"); return true; }
    inserisci(campo, "\n");
  } else if (t === "⌫") {
    const a = campo.selectionStart, b = campo.selectionEnd;
    if (a !== b) campo.setRangeText("", a, b, "end");
    else if (a > 0) campo.setRangeText("", a - 1, a, "end");
    else fatto = false;
  } else if (t === "␣") {
    inserisci(campo, " ");
  } else {
    inserisci(campo, maiuscola || maiuscoleFisse ? t.toUpperCase() : t);
    if (maiuscola) { maiuscola = false; aggiornaTasti(); }
  }
  campo.classList.remove("vuoto");
  aggiornaMaiuscola();
  if (campoAttivo === "titolo" && fatto) titoloToccato();
  return fatto;
}

function inserisci(campo, testo) {
  const massimo = campo.id === "k-titolo" ? 120 : 2000;
  if (campo.value.length + testo.length > massimo) return;
  campo.setRangeText(testo, campo.selectionStart, campo.selectionEnd, "end");
  /* Scrivendo in fondo, il cursore resta in vista anche quando la descrizione
     supera il riquadro. */
  if (campo.tagName === "TEXTAREA" && campo.selectionEnd === campo.value.length) {
    campo.scrollTop = campo.scrollHeight;
  }
}

/* La maiuscola si accende da sola dove la si userebbe: all'inizio del campo
   e dopo la fine di una frase. Chi non la vuole la spegne con un tocco. */
function aggiornaMaiuscola() {
  if (maiuscoleFisse || strato !== LETTERE) return;
  const campo = $("k-" + campoAttivo);
  const prima = campo.value.slice(0, campo.selectionStart);
  const vuole = prima.trim() === "" || /[.!?…]\s+$/.test(prima) || /\n\s*$/.test(prima);
  if (vuole !== maiuscola) { maiuscola = vuole; aggiornaTasti(); }
}

/* La sfumatura in testa si accende solo a testo scorso. */
$("r-testo").addEventListener("scroll", (e) => {
  e.target.classList.toggle("scorso", e.target.scrollTop > 2);
}, { passive: true });

(function preparaEditor() {
  disegnaTastiera();
  rendiToccabile($("k-chiudi"), () => chiudiEditor(true));
  rendiToccabile($("k-salva"), salvaEditor);
  rendiToccabile($("r-correggi"), apriEditor);
  rendiToccabile($("a-aiuta"), apriEditor);
  rendiToccabile($("k-d-si"), () => rispondiAltraLingua(true));
  rendiToccabile($("k-d-no"), () => rispondiAltraLingua(false));
  for (const nome of ["titolo", "descrizione"]) {
    const campo = $("k-" + nome);
    campo.addEventListener("pointerdown", () => attiva(nome, false));
    campo.addEventListener("click", aggiornaMaiuscola);
  }
  /* Una tastiera vera attaccata alla board scrive direttamente nel campo. */
  $("k-titolo").addEventListener("input", titoloToccato);
})();
</script>
</body>
