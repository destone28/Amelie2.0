<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Amelie</title>
<style>
/* ===========================================================================
   MISURE — tutto quello che segue nasce da questi numeri, non dal gusto.

   Il pannello è 800x480 FISICI, 5 pollici di diagonale, ma viene pilotato a
   1280x720 perché alla sua risoluzione nativa resta nero. Quindi:

     · ogni misura scritta qui viene ridotta di 0,625 sul vetro
     · 5" su 800x480 fa 108,9 x 65,3 mm, cioè 7,35 pixel fisici per millimetro
     · un bersaglio tattile onesto è 9 mm  ->  66 px fisici  ->  106 px QUI

   Il testo si misura sull'OCCHIO MEDIO, non sul corpo, e l'occhio dipende
   dal carattere: EB Garamond ce l'ha a 0,40 em, DejaVu Serif - quello che
   esce quando il carattere chiesto manca - a 0,52. A parità di corpo le
   minuscole cambierebbero di un quarto. Per questo il carattere viaggia con
   la pagina (/fonts), e i corpi sono calcolati su di lui:

     · il racconto si legge a mezzo metro con un occhio di 1,7 mm  ->  50 px
     · una scritta che si guarda di passaggio, 1,5 mm              ->  44 px

   È per questo che i numeri sotto sembrano enormi. Non lo sono: sul vetro un
   pulsante da 108 px è un quadrato di nove millimetri, che è il minimo perché
   un dito lo centri al primo colpo senza guardare.
   =========================================================================== */

/* Il carattere sta DENTRO il dispositivo, servito dall'applicazione: non si
   dipende da cosa sia installato sulla board. `block` e non `swap`: il file è
   locale e arriva in pochi millesimi, e per quei millesimi è meglio non vedere
   niente che vedere il testo cambiare forma sotto gli occhi. */
@font-face {
  font-family: "EB Garamond"; font-style: normal; font-weight: 400 800;
  font-display: block; src: url("/fonts/EBGaramond.woff2") format("woff2");
}
@font-face {
  font-family: "EB Garamond"; font-style: italic; font-weight: 400 800;
  font-display: block; src: url("/fonts/EBGaramond-Italic.woff2") format("woff2");
}

:root {
  /* --- Brand. Bordeaux, oro, avorio, carbone: i colori del marchio. ------- */
  --bordeaux-scuro:  #3D1512;   /* il fondo di tutto */
  --bordeaux:        #5A211C;   /* le superfici */
  --bordeaux-chiaro: #7D2B24;   /* stati, bordi accesi */
  --oro-scuro:       #8A6B30;   /* filetti, cose spente */
  --oro:             #C8860D;   /* l'oro del marchio */
  --oro-chiaro:      #E3B457;   /* testo d'accento, ciò che si tocca */
  --avorio:          #F4EDE3;   /* il testo principale */
  --avorio-tenue:    #BFB0A2;   /* il testo secondario: 7,4:1 sul fondo */
  --avorio-fioco:    #8C7F74;   /* cio' che c'e' ma non chiama: 4,6:1, AA */
  --carbone:         #14100F;   /* nero caldo, mai #000 */

  /* Il vino dei calici: una sfumatura dal rubino al granato, e il pelo un
     filo piu' chiaro, perche' il livello si legga. Da solo, sul fondo
     bordeaux, questo rosso non porterebbe nessuna forma: sta sempre DENTRO un
     calice disegnato in oro, che la porta per lui. Una goccia rossa da sola,
     invece, si leggerebbe come sangue. */
  --vino:         #A8323F;
  --vino-fondo:   #5A1320;
  --vino-pelo:    #E59A86;

  /* I toni degli avvisi, gli stessi che l'anello di luce accende (bridge.py):
     se il LED e' rosso, il simbolo a schermo non puo' essere dello stesso oro
     dell'invito. */
  --invito-luce:  #FF9628;      /* AMBRA — si chiede qualcosa */
  --errore-luce:  #EE5F4F;      /* ROSSO — qualcosa non ha funzionato */
  --neutro-luce:  #B9A99A;

  /* Il fondo è una tavola in penombra: più chiaro al centro, dove sta la
     bottiglia, più scuro ai bordi. */
  --fondo: radial-gradient(ellipse at 50% 118%,
             #2E100D 0%, var(--bordeaux-scuro) 46%, var(--carbone) 100%);

  /* --- Ritmo. Un solo passo, i suoi multipli, e nient'altro. -------------- */
  --passo: 12px;
  --margine: calc(var(--passo) * 2);   /* dal bordo del vetro ai comandi */
  --raggio: 18px;
  --raggio-grande: 30px;

  /* --- Bersagli tattili. Vedi il conto in testa al file. ------------------ */
  --tocco: 108px;          /*  9,2 mm sul vetro */
  --tocco-grande: 140px;   /* 11,9 mm — il pulsante che si cerca senza guardare */

  /* --- Tipografia. Sei corpi e basta, distanti abbastanza da fare
     gerarchia: corpi vicini - 38, 40, 42 - non la fanno, fanno rumore. ------ */
  --t-marchio:  104px;     /* l'altezza del marchio, non un corpo */
  --t-titolo:    60px;     /* il nome del vino */
  --t-corpo:     50px;     /* il racconto */
  --t-voce:      44px;     /* cio' che il dispositivo dice a schermo */
  --t-sottotit:  34px;     /* il produttore, le scelte secondarie */
  --t-piccolo:   30px;     /* le spiegazioni */
  --t-minuto:    24px;     /* solo cose di servizio */
  /* Una sola spaziatura fra le lettere, per le sole scritte maiuscole: le
     capitali accostate si impastano, e una misura sola le tiene uguali in
     tutta l'interfaccia. */
  --crenatura-maiuscole: .14em;

  /* --- Movimento. Quattro durate e una curva, per tutto: ogni cosa che si
     muove prende la durata del suo genere, non una scelta caso per caso. ---- */
  --d-tocco:  .12s;        /* il ritorno sotto il dito */
  --d-stato:  .28s;        /* un comando che cambia, un pannello che si apre */
  --d-vista:  .45s;        /* una schermata che lascia il posto a un'altra */
  --ciclo:    3s;          /* il respiro di tutto cio' che aspetta */
  --curva: cubic-bezier(.22,.61,.36,1);
}

/* ===========================================================================
   TOCCO — un chiosco non è una pagina web. Tutto ciò che un browser fa di
   utile a un mouse, qui è un difetto: il cursore che compare, il testo che si
   seleziona, il lampo azzurro sul tocco, il menu contestuale dopo un secondo
   di pressione, il doppio tocco che ingrandisce, la pagina che rimbalza.
   =========================================================================== */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  cursor: none;                        /* anche sui pulsanti, che di norma no */
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none; user-select: none;
  -webkit-user-drag: none;
  -webkit-appearance: none; appearance: none;
}
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  overscroll-behavior: none;           /* niente rimbalzo, niente ricarica */
  touch-action: manipulation;          /* niente ingrandimento al doppio tocco */
  background: var(--fondo);
  color: var(--avorio);
  font-family: "EB Garamond", Garamond, serif;
  font-size: var(--t-corpo);
  line-height: 1.4;
  /* Le cifre allineate, non quelle all'antica: EB Garamond di suo scrive
     «2016» con l'1 piccolo e il 6 che scende sotto la riga, bello in un
     libro e sbagliato in un'annata letta di sbieco da mezzo metro. */
  font-variant-numeric: lining-nums;
  font-kerning: normal;
  -webkit-font-smoothing: antialiased;
}
svg { display: block; }
/* Il contorno di messa a fuoco va tolto QUI e non nel selettore universale:
   la regola dell'agente utente e' `:focus-visible { outline: auto }`, che ha
   specificita' maggiore di `*` e vincerebbe. Qui non c'e' tastiera fisica: non
   esiste un "elemento in evidenza" da mostrare a nessuno. */
:focus, :focus-visible, :focus-within { outline: none !important; }

/* ALLINEAMENTO — una regola sola, e vale ovunque.
   · Cio' che si GUARDA - un titolo, un invito, una domanda, un avviso - sta
     al centro, e va a capo bilanciato: mai una parola sola sulla seconda
     riga, come «Provi a girarla verso di / me?».
   · Cio' che si LEGGE - il racconto, i campi dell'editor - sta a sinistra,
     a bandiera, e va a capo evitando le righe corte in fondo. Giustificato
     no: su una colonna di quaranta caratteri, senza sillabazione (che offline
     Chromium non ha), la giustificazione apre fiumi di bianco fra le parole. */
.al-centro { text-align: center; text-wrap: balance; }
.a-sinistra { text-align: left; text-wrap: pretty; }

/* Il disegno e' scritto per 1280x720 e ci resta: la scena e' un rettangolo di
   quella misura, scalato per stare nel pannello qualunque risoluzione gli
   venga data. Si scala sul minore dei due rapporti perche' 800x480 e' 5:3 e
   1280x720 e' 16:9: scalando sulla sola larghezza il fondo del racconto
   finirebbe fuori. */
#scena {
  position: absolute; left: 50%; top: 50%;
  width: 1280px; height: 720px; margin: -360px 0 0 -640px;
  /* Il fattore lo calcola il JavaScript e lo scrive in --scala: in CSS una
     divisione fra lunghezze resta una lunghezza, e `scale()` vuole un numero. */
  transform: scale(var(--scala, 1));
  transform-origin: center center;
  display: flex; align-items: center; justify-content: center;
}

/* Le viste stanno una sopra l'altra e si scambiano in dissolvenza: niente
   salti di layout, niente testo che si riflette mentre lo si legge. */
.vista {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; text-wrap: balance;
  padding: calc(var(--passo) * 3) calc(var(--passo) * 5);
  gap: calc(var(--passo) * 2);
  opacity: 0; visibility: hidden; pointer-events: none;
  /* La visibilita' cambia a dissolvenza FINITA in uscita e subito in entrata:
     `pointer-events` non si anima, quindi non esiste nessuna finestra in cui
     due viste sono toccabili insieme. */
  transition: opacity var(--d-vista) var(--curva), visibility 0s linear var(--d-vista);
}
.vista.attiva {
  opacity: 1; visibility: visible; pointer-events: auto;
  transition: opacity var(--d-vista) var(--curva), visibility 0s;
}

/* ===========================================================================
   MARCHIO — un calice, e il nome.

   Il simbolo e' un calice, non una goccia: da sola, sul fondo scuro, una
   goccia rossa fa pensare al sangue prima che al vino. Il calice non lascia
   dubbi: la coppa a tulipano, il vino fino al punto piu' largo, dove lo si
   versa davvero, e un riflesso. E' lo stesso calice di tutta l'interfaccia -
   l'icona del racconto, la lettura, la scrittura, l'avvio - disegnato una
   volta in un riquadro di 120x170 e cambiato solo di misura; la coppa che
   ritaglia il vino e la sfumatura del vino stanno una volta sola, in
   `.definizioni`.

   Il nome non e' TESTO: e' disegnato a tracciati, ricavati dal carattere (EB
   Garamond a peso 440). Cosi' e' identico qui, nella schermata d'avvio - che
   si apre da file, prima che esista un server da cui scaricare un carattere -
   e in qualunque anteprima, senza dipendere da nessun font installato.
   =========================================================================== */
.definizioni { position: absolute; width: 0; height: 0; overflow: hidden; }
#vino .alto  { stop-color: var(--vino); }
#vino .basso { stop-color: var(--vino-fondo); }
/* Disegni a filo, d'oro. Il tratto resta dello stesso spessore a ogni misura,
   dal calice del marchio al calicino della scrittura: cambiando solo la
   scala del disegno, il calice piccolo avrebbe avuto un filo di un pixel e il
   grande uno di cinque. */
.segno .linea {
  fill: none; stroke: var(--oro-chiaro); stroke-width: 2.6px;
  stroke-linecap: round; stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}
.segno .sottile { stroke-width: 1.9px; }
.segno .vino { fill: url(#vino); }
.segno .pelo { fill: none; stroke: var(--vino-pelo); stroke-width: 1.4px;
               vector-effect: non-scaling-stroke; opacity: .75; }
.segno .riflesso { fill: none; stroke: var(--avorio); stroke-width: 1.8px;
                   stroke-linecap: round; vector-effect: non-scaling-stroke;
                   opacity: .28; }
.marchio { display: flex; flex-direction: column; align-items: center;
           gap: calc(var(--passo) * .8); }
.marchio .calice { height: 118px; width: auto; overflow: visible; }
/* Accanto al nome, che ha aste piene, il filo del calice e' un poco piu' deciso. */
.marchio .calice .linea { stroke-width: 3px; }
.marchio .nome { height: var(--t-marchio); width: auto; overflow: visible; }
.marchio .parola { fill: var(--oro-chiaro); }

/* ===========================================================================
   ATTESA — il marchio, una frase, e che cosa fa l'oggetto in tre passi.

   Senza tecnica: scegli, posa, ascolta. Tre colonne e non un paragrafo,
   perche' da un tavolo si guardano, non si leggono: l'icona dice la cosa, il
   verbo il gesto, il resto della riga lo finisce. La frase sotto il nome e' in
   corsivo, l'unico del progetto: e' la voce del locale, non un'istruzione.
   =========================================================================== */
#attesa { gap: 0; padding-top: calc(var(--passo) * 2); }
.motto {
  font-style: italic; font-size: var(--t-sottotit); color: var(--avorio-tenue);
  line-height: 1.3; margin-top: calc(var(--passo) * 1.2);
}
.filo {
  width: 220px; height: 2px; border: 0; flex: none;
  margin-top: calc(var(--passo) * 2.2);
  background: linear-gradient(90deg, transparent, var(--oro-scuro), transparent);
}
.passi {
  display: flex; align-items: flex-start; justify-content: center;
  gap: calc(var(--passo) * 2);
  margin-top: calc(var(--passo) * 2.5);
  width: 100%;
}
.passo { flex: 0 0 370px; display: flex; flex-direction: column; align-items: center;
         gap: 4px; }
/* Le tre icone poggiano sulla stessa riga, in una fascia alta uguale. Alte
   uguali no: una bottiglia e' alta e stretta, un calice largo e basso, e a
   pari altezza la bottiglia sembrerebbe la piu' piccola delle tre. */
.passo .icone { height: 84px; display: flex; align-items: flex-end; justify-content: center;
                margin-bottom: calc(var(--passo) * 1.1); }
.passo .icona { width: auto; height: 72px; overflow: visible; }
.passo .icona.alta { height: 84px; }
.passo .icona.quadra { height: 66px; }
/* Una frase per passo, col verbo in evidenza: «Scegli una bottiglia». Il
   verbo e' il gesto, e si legge da lontano; il resto lo completa. */
.passo .p-frase { font-size: var(--t-sottotit); color: var(--avorio-tenue);
                  line-height: 1.2; text-wrap: balance; }
.passo .p-verbo { font-weight: 600; color: var(--oro-chiaro); }
/* Le due bottiglie accanto a quella scelta sono le altre, e restano indietro. */
.passo .fioca { opacity: .5; }


/* ===========================================================================
   VERSA — il segnale che il dispositivo sta leggendo.

   Una bottiglia si inclina e versa in un calice, che si riempie; poi si
   raddrizza, il vino sfuma e si ricomincia. Niente gocce che cadono da sole:
   sul fondo scuro, una goccia rossa sembrerebbe sangue. Lo stesso ciclo e la
   stessa curva per tutto cio' che aspetta: la lettura qui, la scrittura col
   suo calicino, l'avvio col calice del marchio.

   Deve reggere sia sei decimi di secondo sia venticinque senza diventare
   irritante: il ciclo e' lento e senza rimbalzi. Si muove solo per
   trasformazione e opacita', su un disegno piccolo: l'OCR, che qui e' il
   padrone dei quattro core, non se ne accorge. La bottiglia ruota attorno
   alla bocca, cosi' il getto parte sempre dallo stesso punto.
   =========================================================================== */
.versa { width: 260px; height: 250px; overflow: visible; }
.versa .getto {
  fill: var(--vino);
  transform-box: fill-box; transform-origin: 50% 0%;
  animation: getto var(--ciclo) linear infinite;
}
.versa .bottiglia {
  transform-box: fill-box; transform-origin: 50% 0%;
  animation: inclina var(--ciclo) var(--curva) infinite;
}
.versa .livello { animation: riempie var(--ciclo) var(--curva) infinite; }
@keyframes inclina {
  0%, 84%, 100% { transform: rotate(-12deg); }
  18%, 66%      { transform: rotate(30deg); }
}
@keyframes getto {
  0%, 16%   { transform: scaleY(0); opacity: 1; }
  26%, 64%  { transform: scaleY(1); opacity: 1; }
  72%, 100% { transform: scaleY(1); opacity: 0; }
}
@keyframes riempie {
  0%, 22%  { transform: translateY(44px); opacity: 1; }
  70%, 86% { transform: translateY(0); opacity: 1; }
  100%     { transform: translateY(0); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .versa .getto, .versa .bottiglia, .versa .livello { animation: none; }
  .versa .bottiglia { transform: rotate(30deg); }
  .versa .livello { transform: translateY(20px); }
}
.frase { font-size: var(--t-voce); color: var(--avorio-tenue); }

/* ===========================================================================
   RACCONTO
   =========================================================================== */
#racconto {
  /* Niente `position: relative` qui: sovrascriverebbe l'`absolute` di .vista,
     e il racconto si farebbe dare l'altezza dal contenuto invece che dallo
     schermo, fino a ridursi a una riga. */
  justify-content: flex-start; gap: 0;
  padding-top: calc(var(--passo) * 2); padding-bottom: 0;
}
/* I comandi galleggiano sopra la coda del testo invece di rubargli centocinquanta
   pixel: la sfumatura in fondo al racconto li stacca gia' da sola. */
#racconto .comandi {
  position: absolute; left: 0; right: 0; bottom: calc(var(--passo) * 2.8);
  justify-content: center; padding-bottom: 0;
}
#racconto .progresso {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--passo) * 1.6);
}
/* Il fondo vuoto e' alto quanto la sfumatura: l'ultima riga del racconto
   deve poter salire FUORI dalla sfumatura. Con 176, cioe' fin dove la
   sfumatura finisce, l'ultima riga si fermerebbe a meta' dissolvenza. */
#racconto .testo { padding-bottom: 216px; }
/* Il titolo lascia il posto ai comandi d'angolo, e lo stesso posto a sinistra
   e a destra: centrato sul vetro, non sullo spazio che avanza. */
.intestazione { flex: 0 0 auto; padding: 0 256px; width: 100%; }
.titolo {
  font-size: var(--t-titolo); color: var(--oro-chiaro); line-height: 1.12;
  text-wrap: balance;
  max-width: 100%; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
/* Un nome lungo non si tronca: si rimpicciolisce. Troncato finirebbe in
   «Valpolicella Classico..», cioe' perderebbe proprio la parte che distingue
   quel vino da un altro. Il gradino lo sceglie il JavaScript contando le
   lettere - 1.751 nomi su 19.358 superano la riga - e i due corpi stanno
   nella scala. */
.titolo[data-misura="lungo"]       { font-size: 50px; }
.titolo[data-misura="lunghissimo"] { font-size: 42px; }
.sottotit {
  font-size: var(--t-sottotit); color: var(--avorio-tenue);
  margin-top: calc(var(--passo) * .5);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}

/* Il testo scorre da solo dietro alla frase in ascolto. La barra di
   scorrimento è nascosta: qui non si trascina niente col dito, si ascolta. */
.testo {
  flex: 1 1 auto; width: 100%;
  margin: calc(var(--passo) * 1.5) 0;
  overflow-y: auto; scrollbar-width: none;
  text-align: left; text-wrap: pretty;
  padding: 0 calc(var(--passo) * 2);
  /* Sotto i cinquanta caratteri a riga l'occhio non perde il segno tornando a
     capo da mezzo metro; al corpo del racconto, mille pixel sono
     quarantadue. */
  max-width: 1000px;
  /* Il dito non lo trascina: c'e' il pulsante indietro. */
  touch-action: none;
  line-height: 1.38;
}
/* La sfumatura in testa e in coda dice che il testo continua oltre il bordo.
   Sta sul testo, come maschera: il fondo è radiale, e due strisce di colore
   fisso ci si vedrebbero sopra come bande. Quella in testa c'e' solo quando il
   testo e' scorso: a testo fermo sopra non c'e' niente, e sfumerebbe a meta'
   la prima riga. I 34 e 210 pixel li conosce anche `segui()`. */
.testo {
  mask-image: linear-gradient(to bottom, #000 0,
                              #000 calc(100% - 210px), transparent calc(100% - 176px));
}
.testo.scorso {
  mask-image: linear-gradient(to bottom, transparent 0, #000 34px,
                              #000 calc(100% - 210px), transparent calc(100% - 176px));
}
.testo::-webkit-scrollbar { display: none; }
.testo .frase {
  font-size: var(--t-corpo); color: var(--avorio-tenue);
  transition: color var(--d-stato) var(--curva);
}
/* La frase in ascolto si accende. È l'unico legame fra ciò che si sente e ciò
   che si legge, ed e' ancorato alla POSIZIONE nell'audio, non a una stima. */
.testo .frase.viva { color: var(--avorio); }

/* --- I comandi. Solo questi reagiscono: il resto dello schermo è inerte. --- */
.comandi {
  flex: 0 0 auto; display: flex; align-items: center;
  gap: calc(var(--passo) * 2); padding-bottom: var(--passo);
}
.cmd {
  width: var(--tocco); height: var(--tocco); flex: none;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: 2px solid var(--oro-scuro);
  border-radius: 50%; color: var(--oro-chiaro);
  font: inherit;
  transition: transform var(--d-tocco) var(--curva),
              background-color var(--d-stato), border-color var(--d-stato);
}
.cmd svg { width: 44%; height: 44%; fill: currentColor; }
.cmd.grande {
  width: var(--tocco-grande); height: var(--tocco-grande);
  border-color: var(--oro); border-width: 3px;
}
.cmd.grande svg { width: 40%; height: 40%; }
/* Il ritorno al tocco è immediato e piccolo: su un tavolo serve la conferma
   che il dito è arrivato, non un effetto. */
.cmd.premuto {
  transform: scale(.93);
  background: rgba(200,134,13,.16);
  border-color: var(--oro-chiaro);
}
.cmd[disabled] { opacity: .28; }
/* Le vie d'uscita - chiudere, annullare - hanno il tono spento di «Nessuno di
   questi»: non devono pesare quanto la pausa. */
.cmd.spento { border-color: rgba(138,107,48,.45); color: var(--avorio-tenue); }

/* La barra di avanzamento si muove per scaleX, non per width: la larghezza
   costa un ricalcolo di layout a ogni fotogramma, la trasformazione no. */
.progresso {
  flex: 0 0 auto; width: 62%; height: 4px; border-radius: 2px;
  background: rgba(138,107,48,.32); overflow: hidden;
}
.progresso .riempito {
  width: 100%; height: 100%; background: var(--oro);
  transform: scaleX(0); transform-origin: left center;
  transition: transform .25s linear; will-change: transform;
}

/* Mentre il racconto si scrive. Non e' una decorazione: generare costa
   secondi, e in quei secondi lo schermo mostrerebbe il titolo e sotto il
   vuoto - cioe' sembrerebbe rotto. Il calicino e' il calice del marchio,
   copiato dalla pagina, che si riempie e si vuota col ciclo di tutto cio'
   che aspetta. */
.scrivendo {
  display: flex; align-items: center; gap: calc(var(--passo) * 1.2);
  color: var(--oro-chiaro); font-size: var(--t-voce);
}
.scrivendo .calicino { width: auto; height: 44px; flex: none; overflow: visible; }
.scrivendo .calicino .livello { animation: sorso var(--ciclo) ease-in-out infinite; }
@keyframes sorso { 0%, 100% { transform: translateY(34px); } 50% { transform: translateY(0); } }
@keyframes respiro { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .scrivendo .calicino .livello { animation: none; }
}

/* ===========================================================================
   AVVISO
   =========================================================================== */
.simbolo { font-size: 110px; color: var(--invito-luce); line-height: 1; }
#avviso.errore .simbolo { color: var(--errore-luce); }
#avviso.neutro .simbolo { color: var(--neutro-luce); }
#avviso .frase { max-width: 920px; color: var(--avorio); }

/* ===========================================================================
   LINGUE — le bandierine, in alto a destra.

   Bandiere e non sigle: «IT» ed «EN» vanno lette, una bandiera si riconosce
   prima di leggerla, e da un tavolo e' quello che serve. La scelta si segna
   con un anello, non con una lineetta sotto: a quaranta pixel sotto la
   scritta una lineetta sembrerebbe un filo randagio, non una sottolineatura.

   Disegnate a mano in SVG, e non con le bandiere emoji: su Linux Chromium non
   ha un carattere a colori che le contenga, e 🇮🇹 esce scritto «IT» - cioe'
   di nuovo una sigla.
   =========================================================================== */
#lingue {
  position: absolute; right: 0; top: 0; z-index: 6;
  display: flex; gap: 0; padding: calc(var(--passo) * .5) var(--passo);
}
.lingua {
  width: var(--tocco); height: var(--tocco);
  display: flex; align-items: center; justify-content: center;
  transition: transform var(--d-tocco) var(--curva);
}
.lingua .bandiera {
  width: 60px; height: 60px; border-radius: 50%; overflow: hidden;
  /* Un filo d'avorio attorno a ogni bandiera: il Regno Unito ha il bordo blu
     scuro, e sul fondo bordeaux senza filo non avrebbe un contorno. */
  box-shadow: 0 0 0 2px rgba(244,237,227,.18);
  opacity: .5; filter: saturate(.55);
  transition: opacity var(--d-stato) var(--curva), filter var(--d-stato) var(--curva),
              box-shadow var(--d-stato) var(--curva);
}
.lingua .bandiera svg { width: 100%; height: 100%; }
/* La lingua in uso: piena, con l'anello d'oro. Si distingue per colore E per
   forma, non per il colore soltanto. */
.lingua.corrente .bandiera {
  opacity: 1; filter: none;
  box-shadow: 0 0 0 3px var(--carbone), 0 0 0 6px var(--oro);
}
.lingua.premuto { transform: scale(.92); }
/* Una lingua senza bandiera disegnata esce con la sigla: aggiungerne una deve
   restare un file JSON e nient'altro. */
.lingua .sigla { font-size: var(--t-sottotit); letter-spacing: var(--crenatura-maiuscole);
                 color: var(--avorio-fioco); }
.lingua.corrente .sigla { color: var(--oro-chiaro); }

/* ===========================================================================
   VOLUME — in alto a sinistra, speculare alle lingue.

   Questa catena audio non ha un volume hardware: il suono esce dall'HDMI verso
   lo schermo. Quello che si regola qui e' il PCM, prima di passarlo all'uscita
   (vedi speech.scala_pcm).

   Si vede solo l'altoparlante; il cursore esce al tocco e si richiude da solo.
   Un cursore e non un «meno» e un «piu'»: a tacche, per andare da zero al
   massimo servirebbero dieci tocchi. Il cursore ci va con un gesto, e si
   legge a colpo d'occhio.
   =========================================================================== */
#volume {
  position: absolute; left: 0; top: 0; z-index: 6;
  padding: calc(var(--passo) * .5) var(--passo);
}
#v-piatto {
  display: flex; align-items: center; gap: var(--passo);
  padding: 0 calc(var(--passo) * 2) 0 0;
  /* Il bordo c'e' sempre, trasparente: se comparisse insieme al fondo,
     l'altoparlante si sposterebbe di due pixel a ogni apertura. */
  border: 1px solid transparent; border-radius: calc(var(--tocco) / 2);
  background: transparent;
  transition: background-color var(--d-stato) var(--curva),
              border-color var(--d-stato) var(--curva);
}
#v-apri { border-color: transparent; }
/* Aperto, il gruppo diventa una targa OPACA: sotto ci puo' essere il titolo
   del vino, e anche su un fondo quasi nero il sei per cento di un titolo in
   oro si leggerebbe ancora dentro ai comandi. */
#volume.aperto #v-piatto {
  background: #2A0F0C; border-color: var(--oro-scuro);
  box-shadow: 0 12px 44px rgba(0,0,0,.55);
}
#v-barra {
  display: flex; align-items: center;
  max-width: 0; opacity: 0; overflow: hidden; pointer-events: none;
  transition: max-width var(--d-stato) var(--curva), opacity var(--d-stato) var(--curva);
}
#volume.aperto #v-barra { max-width: 520px; opacity: 1; pointer-events: auto; }
/* Il cursore: tutto il riquadro e' toccabile, alto quanto un bersaglio, anche
   se si vede solo un binario sottile e un pomello. */
#v-cursore {
  position: relative; width: 440px; height: var(--tocco); flex: none;
  touch-action: none;
}
#v-binario {
  position: absolute; left: 30px; right: 30px; top: 50%; height: 8px;
  margin-top: -4px; border-radius: 4px; background: rgba(138,107,48,.34);
  overflow: hidden;
}
#v-pieno {
  width: 100%; height: 100%; background: var(--oro);
  transform: scaleX(var(--v, .6)); transform-origin: left center;
}
#v-pomello {
  position: absolute; top: 50%; left: 30px; width: 52px; height: 52px;
  margin: -26px 0 0 -26px; border-radius: 50%;
  background: var(--avorio); border: 3px solid var(--oro);
  box-shadow: 0 4px 14px rgba(0,0,0,.45);
  transform: translateX(calc(var(--v, .6) * 380px));
  transition: box-shadow var(--d-tocco);
}
#v-cursore.trascina #v-pomello { box-shadow: 0 0 0 10px rgba(227,180,87,.18),
                                             0 4px 14px rgba(0,0,0,.45); }
/* A zero il dispositivo racconta lo stesso, in silenzio: le onde dell'icona
   spariscono e compare il taglio. Sotto meta' corsa ne resta una: il livello
   si sa anche a comando chiuso, che e' come sta per tutta la sera. */
#volume.muto #v-apri { color: var(--avorio-fioco); }
.altoparlante .onda { transition: opacity var(--d-stato); }
#volume.piano .altoparlante .onda.lontana { opacity: 0; }
#volume.muto .altoparlante .onda { opacity: 0; }
.altoparlante .taglio { opacity: 0; transition: opacity var(--d-stato); }
#volume.muto .altoparlante .taglio { opacity: 1; }
#volume[hidden] { display: none; }

/* ===========================================================================
   DIDASCALIA — che cosa il dispositivo sta dicendo, adesso.

   Sta in basso, come un sottotitolo, e cambia quando cambia la VOCE: il server
   la manda nel momento in cui una frase comincia a sentirsi, non quando la
   scrive.
   =========================================================================== */
#didascalia {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 8;
  display: flex; align-items: flex-end; justify-content: center;
  min-height: 168px;
  padding: 0 calc(var(--passo) * 6) calc(var(--passo) * 3);
  font-size: var(--t-voce); line-height: 1.25; color: var(--avorio);
  text-align: center; text-wrap: balance; pointer-events: none;
  background: linear-gradient(transparent 0, rgba(20,16,15,.55) 45%,
                              rgba(20,16,15,.9) 100%);
  opacity: 0; transition: opacity var(--d-stato) var(--curva);
}
#didascalia.visibile { opacity: 1; }
/* Nel racconto no: il testo c'è già tutto, con la frase in ascolto accesa. */
#racconto.attiva ~ #didascalia { display: none; }

/* ===========================================================================
   ANNULLA — chiudere senza dover togliere la bottiglia.

   Sta FUORI dalle viste, come la didascalia: dentro `#racconto` finirebbe
   sotto `.comandi`, che e' una scatola larga tutto lo schermo e si mangerebbe
   il tocco in tutta la fascia bassa. In basso a SINISTRA perche' l'angolo
   destro e' il gesto da tre secondi che apre le impostazioni.
   =========================================================================== */
#annulla {
  position: absolute; left: var(--margine); z-index: 8;
  /* Sulla stessa riga dei cerchi del racconto: il loro `bottom` e' il fondo
     della scatola alta 140, con dentro cerchi da 108 centrati. */
  bottom: calc(var(--passo) * 2.8 + (var(--tocco-grande) - var(--tocco)) / 2);
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity var(--d-stato) var(--curva), visibility 0s linear var(--d-stato),
              transform var(--d-tocco) var(--curva), background-color var(--d-stato),
              border-color var(--d-stato);
}
#annulla.disponibile {
  opacity: 1; visibility: visible; pointer-events: auto;
  transition: opacity var(--d-stato) var(--curva), visibility 0s,
              transform var(--d-tocco) var(--curva), background-color var(--d-stato),
              border-color var(--d-stato);
}
/* Il ritorno al tocco va ridichiarato: `#annulla` ha specificita' 1-1-0 e
   batte `.cmd.premuto`, che ne ha 0-2-0. */
#annulla.premuto { background: rgba(200,134,13,.16); border-color: var(--oro-chiaro); }

/* ===========================================================================
   SERVIZIO — cose che si vedono solo quando qualcosa non va.
   =========================================================================== */
#racconto.senza-voce .comandi,
#racconto.senza-voce .progresso { display: none; }
#muto {
  position: absolute; left: 0; right: 0; bottom: calc(var(--passo) * 2);
  text-align: center; text-wrap: balance;
  font-size: var(--t-sottotit); color: var(--avorio-tenue);
  opacity: 0; transition: opacity var(--d-stato); pointer-events: none;
}
#muto.visibile { opacity: 1; }
#spia {
  position: absolute; right: 10px; bottom: 8px; width: 8px; height: 8px;
  border-radius: 50%; background: var(--oro-scuro); opacity: .3;
  pointer-events: none;
}
#spia.rotto { background: var(--errore-luce); opacity: .95; }

/* La batteria: quattro tacche, grandi, nella riga delle impostazioni che la
   riguarda - e solo li'. Senza numero: e' una stima, e un numero le darebbe
   una precisione che non ha. */
#batteria {
  flex: none; position: relative; height: 34px; margin-right: 8px;
  display: flex; gap: 5px; align-items: center;
  padding: 4px 6px; border: 2px solid var(--oro-scuro); border-radius: 6px;
}
#batteria::after {  /* il polo */
  content: ""; position: absolute; right: -8px; top: 9px;
  width: 5px; height: 12px; background: var(--oro-scuro); border-radius: 0 2px 2px 0;
}
#batteria i { display: block; width: 12px; height: 22px; border-radius: 2px;
              background: var(--oro-scuro); opacity: .18; }
#batteria.t1 i:nth-child(-n+1), #batteria.t2 i:nth-child(-n+2),
#batteria.t3 i:nth-child(-n+3), #batteria.t4 i:nth-child(-n+4) { opacity: 1; background: var(--oro); }
#batteria.t1 i:first-child, #batteria.t1 { border-color: var(--oro); }
#batteria.t0 { border-color: var(--errore-luce);
               animation: respiro var(--ciclo) ease-in-out infinite; }

#angolo { position: absolute; right: 0; bottom: 0; width: 110px; height: 110px; z-index: 7; }

/* ===========================================================================
   IMPOSTAZIONI — dallo stesso gesto da tre secondi nell'angolo in basso a
   destra. Un ingresso nascosto basta e avanza: i tre secondi, con lo scarto
   che annulla, sono cio' che tiene fuori la mano dell'ospite.

   Le righe hanno lo stesso bordo, lo stesso raggio e lo stesso ritorno al
   tocco dei pulsanti del racconto: una famiglia sola per la stessa cosa.
   =========================================================================== */
#impostazioni {
  position: absolute; inset: 0; z-index: 9; background: var(--carbone);
}
/* L'elenco scorre; la X per chiudere sta fuori dall'elenco, ferma in basso a
   sinistra, dov'e' quella che interrompe un racconto: e' lo stesso gesto e
   deve stare nello stesso posto. */
#i-elenco {
  position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain;
  display: flex; flex-direction: column; align-items: center;
  justify-content: flex-start; gap: var(--passo);
  padding: calc(var(--passo) * 3) calc(var(--passo) * 3);
  padding-bottom: calc(var(--tocco) + var(--passo) * 4);
}
#i-elenco::-webkit-scrollbar { display: none; }
#i-chiudi {
  position: absolute; left: var(--margine); z-index: 8;
  bottom: calc(var(--passo) * 2.8 + (var(--tocco-grande) - var(--tocco)) / 2);
}
#i-chiudi.premuto { background: rgba(200,134,13,.16); border-color: var(--oro-chiaro); }
#impostazioni[hidden] { display: none; }
#i-titolo { font-size: var(--t-titolo); color: var(--oro-chiaro); margin-bottom: var(--passo); }
.i-riga {
  width: min(860px, 88%); min-height: var(--tocco);
  display: flex; align-items: center; justify-content: space-between;
  gap: calc(var(--passo) * 2); padding: calc(var(--passo) * .75) calc(var(--passo) * 1.5);
  background: rgba(90,33,28,.35); border: 2px solid var(--oro-scuro);
  border-radius: var(--raggio); color: var(--avorio);
  font: inherit; text-align: left;
  transition: transform var(--d-tocco) var(--curva), background-color var(--d-stato),
              border-color var(--d-stato);
}
.i-riga.premuto { transform: scale(.985); background: rgba(200,134,13,.2);
                  border-color: var(--oro-chiaro); }
.i-nome { font-size: var(--t-sottotit); line-height: 1.2; }
/* La spiegazione dice il PREZZO, non la lode: chi accende deve sapere che
   costa un'attesa, altrimenti la prima bottiglia sembra un guasto. */
.i-spiega {
  font-size: var(--t-minuto); color: var(--avorio-tenue);
  margin-top: calc(var(--passo) / 3); max-width: 620px; line-height: 1.3;
  text-wrap: pretty;
}
.i-interruttore {
  flex: none; width: 104px; height: 56px; border-radius: 28px;
  background: rgba(244,237,227,.16); border: 2px solid rgba(244,237,227,.3);
  position: relative; transition: background var(--d-stato), border-color var(--d-stato);
}
.i-pallina {
  position: absolute; top: 4px; left: 4px; width: 44px; height: 44px;
  border-radius: 50%; background: var(--avorio); transition: transform var(--d-stato) var(--curva);
}
.i-riga.acceso .i-interruttore { background: rgba(200,134,13,.55); border-color: var(--oro); }
.i-riga.acceso .i-pallina { transform: translateX(48px); }
/* Un modo che il dispositivo non puo' servire non si mostra: un comando che non
   fa niente e' peggio di nessun comando. */
.i-scelta[hidden] { display: none; }
.i-titoletto {
  width: min(860px, 88%); font-size: var(--t-minuto);
  letter-spacing: var(--crenatura-maiuscole); text-transform: uppercase;
  color: var(--oro); margin-top: var(--passo);
}
/* Il segno di spunta occupa il suo posto anche quando non si vede: senza,
   scegliendo una riga tutte le altre si sposterebbero di lato. */
.i-segno {
  flex: none; width: 60px; text-align: center;
  font-size: var(--t-sottotit); color: var(--oro); visibility: hidden;
}
.i-scelta.acceso .i-segno { visibility: visible; }
/* «Ripristina»: mentre lavora la riga si smorza, e a lavoro fatto la spunta
   si accende un attimo, poi il pannello si chiude sull'invito. */
#i-ripristina.in-corso { opacity: .55; }
#i-ripristina.fatto .i-segno { visibility: visible; }
.i-scelta.acceso { border-color: var(--oro); background: rgba(200,134,13,.12); }

/* ===========================================================================
   MIRINO — occupa tutto il vetro perche' quello che si sta guardando e'
   l'inquadratura: ridurla per far posto a una cornice vorrebbe dire tarare
   una cosa guardandone un'altra.
   =========================================================================== */
#mirino {
  position: absolute; inset: 0; z-index: 10; background: #0d0a09;
  display: flex; gap: calc(var(--passo) * 1.5);
  padding: var(--passo); align-items: stretch;
}
#mirino[hidden] { display: none; }
/* Il video sta IN PIEDI, perche' in piedi sta la bottiglia: la camera e'
   montata di lato e il fotogramma raddrizzato e' 1080x1920. */
#m-video {
  flex: 0 1 auto; min-width: 0; min-height: 0; height: 100%; width: auto;
  object-fit: contain; border-radius: var(--raggio); background: #000;
}
#m-lato {
  flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column;
  gap: var(--passo); color: var(--avorio);
  font-size: var(--t-minuto); line-height: 1.3;
}
/* Scorre il CORPO, non il pannello: con il pulsante dentro all'elenco l'unica
   via d'uscita dal mirino finirebbe sotto il bordo dello schermo. */
#m-corpo { flex: 1 1 auto; min-height: 0; overflow: auto; }
#m-corpo::-webkit-scrollbar { display: none; }
#m-lato h3 {
  margin: 0 0 .3em; font-size: calc(var(--t-minuto) * .85); font-weight: 600;
  letter-spacing: var(--crenatura-maiuscole); text-transform: uppercase; color: var(--oro);
}
#m-lato h3:not(:first-child) { margin-top: .8em; }
#m-lato p { margin: .2em 0; }
#m-lato ul { margin: 0; padding-left: 1.1em; }
#m-lato li { margin: .1em 0; }
#m-lato code { background: rgba(244,237,227,.09); padding: 0 5px; border-radius: 4px; }
#m-lato .certo { color: #5CDC7A; }
#m-lato .dubbio { color: #FF9628; }
#m-lato .nulla { color: #EE5F4F; }
#m-lato .fioco { color: rgba(244,237,227,.6); }
#m-torna {
  flex: none; min-height: var(--tocco);
  display: flex; align-items: center; justify-content: center;
  font-size: var(--t-sottotit); color: var(--avorio);
  border: 2px solid var(--oro); border-radius: var(--raggio);
}
#m-torna.premuto { background: rgba(200,134,13,.2); border-color: var(--oro-chiaro); }
@media (max-height: 520px) {
  #m-video { height: auto; width: auto; max-width: 45%; flex: 0 1 auto; }
}

#diagnostica {
  position: absolute; inset: 0; z-index: 9; background: var(--carbone);
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: var(--passo); padding: calc(var(--passo) * 3);
}
#diagnostica[hidden] { display: none; }
#d-corpo {
  font-family: ui-monospace, monospace; font-size: 26px; line-height: 1.4;
  color: var(--avorio); max-height: 70%; overflow: auto; white-space: pre-wrap;
}
#d-corpo::-webkit-scrollbar { display: none; }
#d-chiudi {
  min-width: calc(var(--tocco) * 2.5); height: var(--tocco);
  display: flex; align-items: center; justify-content: center;
  font-size: var(--t-sottotit); color: var(--avorio);
  border: 2px solid var(--oro); border-radius: var(--raggio);
}
#d-chiudi.premuto { background: rgba(200,134,13,.2); border-color: var(--oro-chiaro); }

/* ===========================================================================
   CORREGGERE — la bottiglia che non e' in archivio, descritta da chi la conosce.

   Il pulsante sta nell'intestazione, sotto il titolo generico che corregge.
   In coda al racconto finirebbe sotto la sfumatura del testo, o fuori dal
   riquadro finche' il testo non scorre fino in fondo: un pulsante che si
   vede solo a volte non c'e'. Compare insieme al testo e non prima, perche'
   prima non c'e' niente da correggere; ha il filetto e l'oro dei comandi,
   perche' e' un comando.
   =========================================================================== */
/* La scatola e' alta un bersaglio, 108 pixel, e la pillola che si vede ne
   occupa 60 al centro: i margini negativi le restituiscono lo spazio che ha
   in piu'. Il bersaglio deve essere la SCATOLA, non uno pseudo-elemento
   allargato: `rendiToccabile` agisce solo se il dito si alza dentro il
   riquadro dell'elemento, e un tocco sull'alone di un ::before partirebbe e
   poi non farebbe niente. */
.correggi {
  display: inline-flex; align-items: center; justify-content: center;
  height: var(--tocco); padding: 0 var(--passo);
  margin: calc(var(--passo) * 1.25 - (var(--tocco) - 60px) / 2) 0
          calc((60px - var(--tocco)) / 2);
  animation: affiora var(--d-vista) var(--curva);
}
.correggi[hidden] { display: none; }
.correggi .pillola {
  display: inline-flex; align-items: center; gap: var(--passo);
  height: 60px; padding: 0 calc(var(--passo) * 2.25);
  border: 2px solid var(--oro-scuro); border-radius: 30px;
  font-size: var(--t-piccolo); color: var(--oro-chiaro);
  background: rgba(200,134,13,.08);
  transition: transform var(--d-tocco) var(--curva), background-color var(--d-stato),
              border-color var(--d-stato);
}
.correggi svg { width: 24px; height: 24px; fill: currentColor; flex: none; }
.correggi.premuto .pillola { transform: scale(.97); background: rgba(200,134,13,.22);
                             border-color: var(--oro); }
@keyframes affiora { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .correggi { animation: none; } }

/* L'editor copre tutto, anche lingue e volume: mentre si scrive il
   dispositivo non racconta, non ascolta il piatto e non cambia lingua. */
#correzione {
  position: absolute; inset: 0; z-index: 11; background: var(--carbone);
  display: flex; flex-direction: column;
}
#correzione[hidden] { display: none; }
#k-barra {
  flex: none; height: 88px; display: flex; align-items: center;
  gap: calc(var(--passo) * 2); padding: 0 var(--margine);
}
#k-barra .cmd { width: 72px; height: 72px; }
#k-titolo-editor { flex: 1; font-size: var(--t-sottotit); color: var(--oro-chiaro);
                   text-align: center; white-space: nowrap; overflow: hidden;
                   text-overflow: ellipsis; }
#k-salva {
  flex: none; height: 72px; min-width: 180px; padding: 0 calc(var(--passo) * 2.5);
  display: flex; align-items: center; justify-content: center;
  font-size: var(--t-piccolo); color: var(--carbone); background: var(--oro-chiaro);
  border-radius: 36px; font-weight: 500;
  transition: transform var(--d-tocco) var(--curva), background-color var(--d-stato);
}
#k-salva.premuto { transform: scale(.96); background: var(--oro); }
/* Mentre scrive - foto, parole, punti dell'etichetta - non si ripreme. */
#k-salva.in-corso { opacity: .55; }
#k-salva.nascosto { visibility: hidden; }
/* Una riga sola sotto la barra: di norma spiega che cosa resta sul
   dispositivo; se la bottiglia somiglia a una gia' corretta, propone quella. */
#k-nota {
  flex: none; min-height: 60px; display: flex; align-items: center;
  justify-content: center; text-align: center;
  gap: var(--passo); padding: 0 var(--margine);
  font-size: var(--t-minuto); color: var(--avorio-tenue); line-height: 1.25;
}
#k-nota.errore { color: var(--errore-luce); }
#k-nota.fatto { color: var(--oro-chiaro); }
.k-vicina {
  display: flex; align-items: center; gap: 10px; height: 56px;
  padding: 0 18px 0 6px; border: 2px solid var(--oro-scuro); border-radius: 28px;
  color: var(--avorio); font-size: var(--t-minuto); white-space: nowrap;
}
.k-vicina img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
.k-vicina.scelta { border-color: var(--oro); background: rgba(200,134,13,.18); }
/* Le proposte mentre si scrive il titolo prendono il posto della
   descrizione: e' li' che l'occhio va, sotto il campo in cui si scrive, e
   mentre si scrive il titolo la descrizione non serve. Tre colonne e due
   righe: cinque bottiglie e, nell'ultima casella, «Nessuna di queste», che
   passa alle cinque dopo o, finite, riporta alla descrizione. In fila, come
   pillole sopra il titolo, se ne vedrebbero quante ci stanno, e le altre
   uscirebbero dallo schermo senza modo di raggiungerle. */
#k-proposte {
  flex: 1; min-height: 0;
  display: grid; gap: 8px;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: repeat(2, minmax(0, 1fr));
}
#k-proposte[hidden], #k-descrizione[hidden] { display: none; }
.k-opzione {
  min-width: 0; min-height: 0; padding: 0 16px;
  display: flex; flex-direction: column; justify-content: center;
  border: 2px solid var(--oro-scuro); border-radius: 14px;
  background: rgba(90,33,28,.45);
  transition: background-color var(--d-tocco), border-color var(--d-tocco);
}
.k-opzione .t { font-size: var(--t-minuto); color: var(--avorio); line-height: 1.1;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.k-opzione .f { font-size: 16px; color: var(--avorio-fioco); line-height: 1.25;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.k-opzione.premuto { background: rgba(200,134,13,.22); border-color: var(--oro); }
/* «Nessuna di queste» non e' una bottiglia: niente fondo, filetto a tratti. */
.k-opzione.nessuna { background: transparent; border-style: dashed;
                     border-color: rgba(200,134,13,.55); }
.k-opzione.nessuna .t { color: var(--oro-chiaro); }
.k-vicina.premuto { background: rgba(200,134,13,.22); }
/* Il collegamento scelto: a quale vino la bottiglia sara' ricondotta. La
   crocetta lo toglie. */
.k-collegata { color: var(--oro-chiaro); white-space: nowrap; overflow: hidden;
               text-overflow: ellipsis; }
.k-scollega {
  flex: none; width: 48px; height: 48px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--oro-scuro); color: var(--avorio-tenue);
}
.k-scollega svg { width: 22px; height: 22px; fill: currentColor; }
#k-campi {
  flex: 1 1 auto; min-height: 0; display: flex; gap: calc(var(--passo) * 1.5);
  padding: 0 var(--margine) var(--passo);
}
#k-foto {
  flex: none; width: 120px; border-radius: var(--raggio); background: #000;
  object-fit: cover;
}
#k-colonna { flex: 1; min-width: 0; display: flex; flex-direction: column;
             gap: var(--passo); }
.k-campo {
  width: 100%; font: inherit; color: var(--avorio); line-height: 1.3;
  background: rgba(90,33,28,.35); border: 2px solid var(--oro-scuro);
  border-radius: var(--raggio); padding: 10px 18px;
  /* Qui si seleziona e si sposta il cursore col dito: e' l'unico posto
     dell'interfaccia in cui il testo si puo' toccare. */
  -webkit-user-select: text; user-select: text; caret-color: var(--oro-chiaro);
  resize: none; outline: none;
}
.k-campo::placeholder { color: var(--avorio-fioco); }
.k-campo.attivo { border-color: var(--oro); background: rgba(90,33,28,.6); }
.k-campo.vuoto { border-color: var(--errore-luce); }
#k-domanda {
  position: absolute; left: 0; right: 0; top: 88px; bottom: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--passo) * 4); padding: 0 var(--margine);
  background: var(--carbone); animation: affiora var(--d-vista) var(--curva);
}
#k-domanda[hidden] { display: none; }
#k-d-frase { font-size: var(--t-voce); color: var(--avorio); text-align: center;
             max-width: 980px; line-height: 1.25; }
#k-d-scelte { display: flex; gap: calc(var(--passo) * 3); }
.k-d-scelta {
  height: 88px; min-width: 300px; padding: 0 calc(var(--passo) * 3);
  display: flex; align-items: center; justify-content: center;
  font-size: var(--t-sottotit); color: var(--oro-chiaro);
  border: 2px solid var(--oro-scuro); border-radius: 44px;
  transition: transform var(--d-tocco) var(--curva), background-color var(--d-stato);
}
.k-d-scelta.si { color: var(--carbone); background: var(--oro-chiaro); border-color: var(--oro-chiaro);
                 font-weight: 500; }
.k-d-scelta.premuto { transform: scale(.97); }
#k-titolo { font-size: var(--t-sottotit); height: 64px; flex: none; }
#k-descrizione { font-size: var(--t-piccolo); flex: 1; min-height: 0; overflow-y: auto; }
#k-descrizione::-webkit-scrollbar { display: none; }

/* La tastiera. Undici tasti per riga: larghi quanto un polpastrello (104 px,
   8,8 mm sul vetro) e alti un po' meno (80 px, 6,8 mm), come su un telefono -
   quattro righe alte nove millimetri non lascerebbero spazio ai campi. */
#tastiera {
  flex: none; display: flex; flex-direction: column; gap: 8px;
  padding: 12px var(--margine) 16px; background: #1B1412;
  border-top: 1px solid rgba(138,107,48,.35);
}
.t-riga { display: flex; gap: 8px; justify-content: center; }
.tasto {
  flex: 1 1 0; height: 80px; display: flex; align-items: center; justify-content: center;
  font-size: 34px; color: var(--avorio);
  background: rgba(244,237,227,.08); border: 1px solid rgba(200,134,13,.22);
  border-radius: 12px;
  transition: background-color var(--d-tocco);
}
.tasto.servizio { background: rgba(200,134,13,.12); color: var(--oro-chiaro);
                  font-size: var(--t-minuto); }
/* Lo spazio vale cinque tasti piu' i quattro intervalli che ci starebbero in
   mezzo: cosi' le colonne restano in fila da una riga all'altra. */
.tasto.largo { flex: 5 1 32px; font-size: var(--t-minuto); color: var(--avorio-tenue); }
.tasto.acceso { background: rgba(200,134,13,.35); color: var(--avorio); }
.tasto.premuto { background: rgba(200,134,13,.45); }
.tasto svg { width: 34px; height: 34px; fill: currentColor; }
</style>
</head>

<script>
