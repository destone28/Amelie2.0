<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Amelie</title>
<style>
/* ===========================================================================
   MISURE — tutto quello che segue nasce da questi numeri, non dal gusto.

   Il pannello è 800x480 FISICI, 5 pollici di diagonale, ma viene pilotato a
   1280x720 perché alla sua risoluzione nativa resta nero. Quindi:

     · ogni misura scritta qui viene ridotta di 0,625 sul vetro
     · 5" su 800x480 fa 108,9 x 65,3 mm, cioè 7,35 pixel fisici per millimetro
     · un bersaglio tattile onesto è 9 mm  ->  66 px fisici  ->  106 px QUI
     · il testo si legge a mezzo metro: 3,5-4 mm  ->  26-29 fisici  ->  42-47 QUI

   È per questo che i numeri sotto sembrano enormi. Non lo sono: sul vetro un
   pulsante da 108 px è un quadrato di nove millimetri, che è il minimo perché
   un dito lo centri al primo colpo senza guardare.
   =========================================================================== */

:root {
  /* --- Brand. Bordeaux, oro, avorio, carbone: i colori del marchio. ------- */
  --bordeaux-scuro:  #3D1512;   /* il fondo di tutto */
  --bordeaux:        #5A211C;   /* il bordo del marchio, le superfici */
  --bordeaux-chiaro: #7D2B24;   /* stati, bordi accesi */
  --oro-scuro:       #8A6B30;   /* filetti, cose spente */
  --oro:             #C8860D;   /* l'oro del marchio */
  --oro-chiaro:      #E3B457;   /* testo d'accento, ciò che si tocca */
  --avorio:          #F4EDE3;   /* il testo principale */
  --avorio-tenue:    #B9A99A;   /* il testo secondario */
  --avorio-fioco:    #8C7F74;   /* cio' che c'e' ma non chiama: 4,6:1, AA */
  --carbone:         #14100F;   /* nero caldo, mai #000 */

  /* I toni degli avvisi, gli stessi che l'anello di luce accende (bridge.py):
     se il LED e' rosso, il simbolo a schermo non puo' essere dello stesso oro
     dell'invito. Prima lo erano tutti, e un guasto aveva l'aria di un invito. */
  --invito-luce:  #FF9628;      /* AMBRA — si chiede qualcosa */
  --errore-luce:  #EE5F4F;      /* ROSSO — qualcosa non ha funzionato */
  --neutro-luce:  #B9A99A;
  /* Il vino nel calice. Non e' --bordeaux-chiaro: su questo fondo darebbe
     1,71:1, cioe' un liquido che non si vede salire. Questo sta a 3,1:1, che
     per una forma piena e' abbastanza. */
  --vino:         #A63A2C;

  /* Il fondo è una tavola in penombra: più chiaro al centro, dove sta la
     bottiglia, più scuro ai bordi. */
  --fondo: radial-gradient(ellipse at 50% 118%,
             #2E100D 0%, var(--bordeaux-scuro) 46%, var(--carbone) 100%);

  /* --- Ritmo. Un solo passo, i suoi multipli. ---------------------------- */
  --passo: 12px;
  --raggio: 18px;
  --raggio-grande: 30px;

  /* --- Bersagli tattili. Vedi il conto in testa al file. ------------------ */
  --tocco: 108px;          /*  9,2 mm sul vetro */
  --tocco-grande: 140px;   /* 11,9 mm — il pulsante che si cerca senza guardare */

  /* --- Tipografia, in px CSS (fra parentesi i millimetri sul vetro). ------ */
  --t-marchio:  132px;     /* 11,2 mm */
  --t-titolo:    64px;     /*  5,4 mm */
  --t-sottotit:  34px;     /*  2,9 mm */
  --t-corpo:     42px;     /*  3,6 mm — il racconto */
  --t-invito:    40px;     /*  3,4 mm */
  --t-scelta:    38px;     /*  3,2 mm */
  --t-minuto:    26px;     /*  2,2 mm — solo cose di servizio */

  --curva: cubic-bezier(.22,.61,.36,1);
}

/* ===========================================================================
   TOCCO — un chiosco non è una pagina web. Tutto ciò che un browser fa di
   utile a un mouse, qui è un difetto: il cursore che compare, il testo che si
   seleziona, il lampo azzurro sul tocco, il menu contestuale dopo un secondo
   di pressione, il doppio tocco che ingrandisce, la pagina che rimbalza.
   =========================================================================== */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  cursor: none;                        /* anche sui pulsanti, che di norma no */
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none; user-select: none;
  -webkit-user-drag: none;
  /* Il contorno di messa a fuoco disegnava un riquadro attorno all'ultima
     cosa toccata e ci restava: qui non c'e' tastiera, e quel riquadro non
     significa niente per nessuno. */
  -webkit-appearance: none; appearance: none;
}
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  overscroll-behavior: none;           /* niente rimbalzo, niente ricarica */
  touch-action: manipulation;          /* niente ingrandimento al doppio tocco */
  background: var(--fondo);
  color: var(--avorio);
  font-family: "EB Garamond", Garamond, "Times New Roman", serif;
  font-size: var(--t-corpo);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
svg { display: block; }
/* Il contorno di messa a fuoco va tolto QUI e non nel selettore universale:
   la regola dell'agente utente e' `:focus-visible { outline: auto }`, che ha
   specificita' maggiore di `*` e vinceva. Si vedeva come un riquadro d'oro
   attorno all'ultima cosa toccata, che ci restava. Qui non c'e' tastiera: non
   esiste un "elemento in evidenza" da mostrare a nessuno. */
:focus, :focus-visible, :focus-within { outline: none !important; }

/* Il disegno e' scritto per 1280x720 e ci resta: la scena e' un rettangolo di
   quella misura, scalato per stare nel pannello qualunque risoluzione gli
   venga data. Senza, a 800x480 l'intestazione e i comandi si prendevano tutti
   i 480 px e al racconto ne restavano DODICI: due decimi di riga. Non un
   difetto di stile - il dispositivo spariva.
   Si scala sul minore dei due rapporti perche' 800x480 e' 5:3 e 1280x720 e'
   16:9: scalando sulla sola larghezza il fondo del racconto finirebbe fuori. */
#scena {
  position: absolute; left: 50%; top: 50%;
  width: 1280px; height: 720px; margin: -360px 0 0 -640px;
  /* Il fattore lo calcola il JavaScript e lo scrive in --scala. In CSS non si
     puo': `min(100vw / 1280, 100vh / 720)` sembra giusto ma una divisione fra
     lunghezze resta una lunghezza, e `scale()` vuole un numero puro - la regola
     veniva scartata in silenzio e la scena restava fuori centro. */
  transform: scale(var(--scala, 1));
  transform-origin: center center;
  display: flex; align-items: center; justify-content: center;
}

/* Le viste stanno una sopra l'altra e si scambiano in dissolvenza: niente
   salti di layout, niente testo che si riflette mentre lo si legge. */
.vista {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  padding: calc(var(--passo) * 3) calc(var(--passo) * 5);
  gap: calc(var(--passo) * 2);
  opacity: 0; visibility: hidden; pointer-events: none;
  /* La visibilita' cambia a dissolvenza FINITA in uscita e subito in entrata.
     Prima era interpolata: per quattro decimi di secondo dopo una scelta i
     pulsanti del racconto restavano coperti da pulsanti di scelta invisibili e
     ancora vivi. `pointer-events` non si anima, quindi non esiste piu' nessuna
     finestra in cui due viste sono toccabili insieme. */
  transition: opacity .4s var(--curva), visibility 0s linear .4s;
}
.vista.attiva {
  opacity: 1; visibility: visible; pointer-events: auto;
  transition: opacity .4s var(--curva), visibility 0s;
}

/* ===========================================================================
   MARCHIO — la semplificazione del logo.

   Tre segni e nient'altro: i QUATTRO MIRINI agli angoli, la BOTTIGLIA al
   centro, la A dentro la bottiglia. Letto tutto insieme dice esattamente cosa
   fa l'oggetto — inquadra una bottiglia e la legge — e il nome ci sta dentro.

   La sagoma animale dell'originale è stata tolta: sotto il centimetro
   diventava una macchia. Tutto è costruito con tratti, non con contorni
   pieni, così resta nitido a ogni misura e non dipende da nessun font
   installato.
   =========================================================================== */
.marchio { width: var(--t-marchio); height: var(--t-marchio); }
.marchio .mirino {
  fill: none; stroke: var(--oro); stroke-width: 5.5;
  stroke-linecap: round; stroke-linejoin: round;
}
.marchio .bottiglia {
  fill: none; stroke: var(--oro); stroke-width: 4.5;
  stroke-linecap: round; stroke-linejoin: round;
}
.marchio .lettera {
  fill: none; stroke: var(--avorio); stroke-width: 5.4;
  stroke-linecap: butt; stroke-linejoin: miter;
}

.nome {
  font-size: var(--t-titolo); letter-spacing: .22em;
  color: var(--oro-chiaro); text-transform: uppercase;
  margin-top: calc(var(--passo) * 1.5);
}
.filo {
  width: 220px; height: 2px; border: 0;
  background: linear-gradient(90deg, transparent, var(--oro-scuro), transparent);
}
.invito { font-size: var(--t-invito); color: var(--avorio-tenue); }

/* ===========================================================================
   CALICE — il segnale che il dispositivo sta lavorando.

   Deve reggere sia sei decimi di secondo (l'assestamento) sia venticinque
   (la scansione con l'OCR), senza diventare irritante: per questo il ciclo è
   lento e non ha rimbalzi. Si muove SOLO per trasformazione e opacità, che
   sono le due cose che Chromium sposta sul compositor: l'animazione non tocca
   il layout e non contende i quattro core all'OCR, che qui è il padrone.
   =========================================================================== */
.calice { width: 254px; height: 314px; }
.calice .vetro {
  fill: none; stroke: var(--oro); stroke-width: 3;
  stroke-linecap: round; stroke-linejoin: round;
}
.calice .vino { fill: var(--vino); }
.calice .pelo { fill: var(--oro-chiaro); opacity: .7; }
.calice .livello {
  animation: versa 4.2s var(--curva) infinite;
  will-change: transform;
}
@keyframes versa {
  0%   { transform: translateY(46px); }   /* vuoto: il livello e' sotto la coppa */
  /* Un terzo scarso di coppa: e' la misura in cui si versa un rosso, e riempirlo
     fino all'orlo faceva sembrare il calice un bicchiere da osteria. */
  44%  { transform: translateY(19px); }
  60%  { transform: translateY(19px); }
  100% { transform: translateY(46px); }
}
/* Il pelo del vino ondeggia appena: senza, il livello sembra un cursore che
   sale, non un liquido. */
.calice .pelo { animation: respira 2.6s ease-in-out infinite; will-change: transform; }
@keyframes respira {
  0%, 100% { transform: translateY(0)   scaleY(1);    }
  50%      { transform: translateY(-1px) scaleY(.82); }
}
@media (prefers-reduced-motion: reduce) {
  .calice .livello, .calice .pelo { animation: none; }
  .calice .livello { transform: translateY(24px); }
}
.frase { font-size: var(--t-invito); color: var(--avorio-tenue); }

/* ===========================================================================
   RACCONTO
   =========================================================================== */
#racconto {
  /* Niente `position: relative` qui: sovrascriverebbe l'`absolute` di .vista,
     e il racconto tornerebbe a farsi dare l'altezza dal contenuto invece che
     dallo schermo. E' successo: il testo si era ridotto a una riga. */
  justify-content: flex-start; gap: 0;
  padding-top: calc(var(--passo) * 2); padding-bottom: 0;
}
/* I comandi galleggiano sopra la coda del testo invece di rubargli centocinquanta
   pixel: la sfumatura in fondo al racconto li stacca gia' da sola. Cosi' il
   racconto passa da quattro righe a sette e mezza. */
#racconto .comandi {
  position: absolute; left: 0; right: 0; bottom: calc(var(--passo) * 2.8);
  justify-content: center; padding-bottom: 0;
}
#racconto .progresso {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--passo) * 1.6);
}
#racconto .testo { padding-bottom: 176px; }
/* Il titolo lascia il posto alle linguette della lingua: senza, un nome lungo
   ci finisce sotto - e sono 1.751 nomi su 19.358 a superare la riga. */
.intestazione { flex: 0 0 auto; padding: 0 268px; width: 100%; }
.titolo {
  font-size: var(--t-titolo); color: var(--oro-chiaro); line-height: 1.15;
  /* Un nome lungo non deve spingere il racconto fuori dallo schermo. */
  max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.sottotit {
  font-size: var(--t-sottotit); color: var(--avorio-tenue);
  letter-spacing: .05em; margin-top: calc(var(--passo) * .5);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}

/* Il testo scorre da solo dietro alla frase in ascolto. La barra di
   scorrimento è nascosta: qui non si trascina niente col dito, si ascolta. */
.testo {
  flex: 1 1 auto; width: 100%;
  margin: calc(var(--passo) * 1.5) 0;
  overflow-y: auto; scrollbar-width: none;
  text-align: left; padding: 0 calc(var(--passo) * 2);
  /* Una riga di sessanta caratteri stanca l'occhio, e a mezzo metro il ritorno
     a capo si sbaglia. Sotto i cinquanta si legge senza perdere il segno. */
  max-width: 1000px;
  /* Il dito non lo trascina: c'e' il pulsante indietro. Chi tornasse a rileggere
     verrebbe strappato via dalla frase parlata al primo evento successivo, con
     un'animazione morbida che gli litiga contro. */
  touch-action: none;
}
/* La sfumatura in testa e in coda dice che il testo continua oltre il bordo.
   Sta sul testo, come maschera, e NON come due strisce di gradiente sopra la
   vista: il fondo è radiale, non una tinta piatta, e due rettangoli di colore
   fisso ci si vedevano sopra come bande. Il costo di ri-generare il livello
   c'è, ma si paga a ogni FRASE - una volta ogni pochi secondi - non a ogni
   fotogramma. */
.testo {
  mask-image: linear-gradient(to bottom, transparent 0, #000 34px,
                              #000 calc(100% - 210px), transparent calc(100% - 176px));
}
.testo::-webkit-scrollbar { display: none; }
.testo .frase {
  font-size: var(--t-corpo); color: var(--avorio-tenue);
  transition: color .35s var(--curva);
}
/* La frase in ascolto si accende. È l'unico legame fra ciò che si sente e ciò
   che si legge, e adesso è ancorato alla POSIZIONE nell'audio, non a una
   stima: con un pulsante di pausa una stima divergerebbe al primo tocco. */
.testo .frase.viva { color: var(--avorio); }

/* --- I comandi. Solo questi reagiscono: il resto dello schermo è inerte. --- */
.comandi {
  flex: 0 0 auto; display: flex; align-items: center;
  gap: calc(var(--passo) * 2); padding-bottom: var(--passo);
}
.cmd {
  width: var(--tocco); height: var(--tocco);
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: 2px solid var(--oro-scuro);
  border-radius: 50%; color: var(--oro-chiaro);
  font: inherit;
  transition: transform .12s var(--curva), background-color .2s, border-color .2s;
}
.cmd svg { width: 46%; height: 46%; fill: currentColor; }
.cmd.grande {
  width: var(--tocco-grande); height: var(--tocco-grande);
  border-color: var(--oro); border-width: 3px;
}
.cmd.grande svg { width: 42%; height: 42%; }
/* Il ritorno al tocco è immediato e piccolo: su un tavolo serve la conferma
   che il dito è arrivato, non un effetto. */
.cmd.premuto {
  transform: scale(.93);
  background: rgba(200,134,13,.16);
  border-color: var(--oro-chiaro);
}
.cmd[disabled] { opacity: .28; }

/* La barra di avanzamento si muove per scaleX, non per width: la larghezza
   costa un ricalcolo di layout a ogni fotogramma, la trasformazione no. */
.progresso {
  flex: 0 0 auto; width: 62%; height: 4px; border-radius: 2px;
  background: rgba(138,107,48,.32); overflow: hidden;
}
.progresso .riempito {
  width: 100%; height: 100%; background: var(--oro);
  transform: scaleX(0); transform-origin: left center;
  transition: transform .25s linear; will-change: transform;
}

/* ===========================================================================
   CONFERMA — quando il riconoscimento è dubbio si chiede, non si indovina.
   =========================================================================== */
.domanda { font-size: var(--t-invito); color: var(--avorio-tenue); }
.scelte {
  display: flex; flex-direction: column;
  /* Trenta pixel, cioe' due millimetri e mezzo sul vetro. Con dodici erano un
     decimo di dito, e toccare la riga sbagliata non si annulla: non esiste una
     transizione che riporti alla schermata di conferma. */
  gap: calc(var(--passo) * 2.5);
  width: 100%; max-width: 940px;
}
/* Legata al suo contenitore, cosi' non colpisce piu' niente fuori di qui: era
   gia' successo con la linguetta della lingua, che ne ereditava fondo e bordo. */
#c-scelte .scelta {
  min-height: var(--tocco);
  display: flex; align-items: center; justify-content: center;
  padding: 0 calc(var(--passo) * 2);
  font-size: var(--t-scelta); color: var(--avorio);
  background: rgba(90,33,28,.55);
  border: 2px solid var(--oro-scuro); border-radius: var(--raggio);
  transition: transform .12s var(--curva), background-color .2s;
}
#c-scelte .scelta.premuto {
  transform: scale(.985);
  background: rgba(200,134,13,.2); border-color: var(--oro-chiaro);
}
/* «Nessuno di questi» non è una scelta come le altre: non è un vino. Si
   distingue senza gridare — nessun fondo, un bordo appena accennato, il testo
   piu' tenue — così l'occhio la trova quando serve e la scavalca quando no. */
#c-scelte .scelta.nessuno {
  background: transparent; border-color: rgba(138,107,48,.45);
  color: var(--avorio-tenue); font-size: var(--t-sottotit);
  min-height: calc(var(--tocco) * .82);
}

/* ===========================================================================
   AVVISO
   =========================================================================== */
.simbolo { font-size: 110px; color: var(--invito-luce); line-height: 1; }
#avviso.errore .simbolo { color: var(--errore-luce); }
#avviso.neutro .simbolo { color: var(--neutro-luce); }
#avviso .frase { max-width: 900px; color: var(--avorio); }

/* ===========================================================================
   LINGUE — in alto a destra, dove non coprono né titolo né testo.
   =========================================================================== */
#lingue {
  position: absolute; right: 0; top: 0; z-index: 6;
  display: flex; padding: var(--passo) calc(var(--passo) * 1.5);
}
.lingua {
  min-width: var(--tocco); height: var(--tocco);
  display: flex; align-items: center; justify-content: center;
  font-size: var(--t-sottotit); letter-spacing: .16em;
  /* Colore pieno, non opacita': a .5 il contrasto scendeva a 2,75:1, sotto
     qualunque soglia di leggibilita'. */
  color: var(--avorio-fioco);
  border-bottom: 3px solid transparent;
  transition: opacity .25s, color .25s, border-color .25s, transform .12s;
}
/* Si chiama "corrente", non "scelta": `.scelta` e' gia' la riga della
   schermata di conferma, e il pulsante della lingua ne ereditava fondo, bordo
   e raggio. A schermo si vedeva come un riquadro attorno alla lingua attiva,
   che nessuno aveva disegnato. */
.lingua.corrente { color: var(--oro-chiaro); border-bottom-color: var(--oro); }
.lingua.premuto { transform: scale(.94); }

/* ===========================================================================
   VOLUME — in alto a sinistra, dov'e' speculare alle lingue.

   Questa catena audio non ha un volume hardware: il suono esce dall'HDMI verso
   lo schermo, e i controlli del mixer appartengono a un altro percorso. Quello
   che si regola qui e' il PCM, prima di consegnarlo (vedi speech.scala_pcm).

   Si vede solo l'altoparlante; il resto esce al tocco e si richiude da solo.
   Un dispositivo da tavolo non deve mostrare una manopola a chi voleva sapere
   che vino ha in mano — ma chi apre il locale la deve trovare al primo colpo
   d'occhio, senza istruzioni.
   =========================================================================== */
#volume {
  position: absolute; left: 0; top: 0; z-index: 6;
  padding: var(--passo) calc(var(--passo) * 1.5);
}
#v-piatto {
  display: flex; align-items: center; gap: calc(var(--passo) * 1.5);
  padding: calc(var(--passo) * .5);
  /* Il bordo c'e' sempre, trasparente: se comparisse insieme al fondo,
     l'altoparlante si sposterebbe di due pixel a ogni apertura. */
  border: 1px solid transparent; border-radius: var(--raggio-grande);
  background: transparent;
  transition: background-color .25s var(--curva), border-color .25s var(--curva);
}
/* Aperto, il gruppo diventa una targa: sotto ci puo' essere il titolo del vino,
   e un comando che si legge a meta' e' peggio di un comando che copre.

   OPACA, non al 94%: su un fondo quasi nero il sei per cento di un titolo in
   oro si legge ancora benissimo, e si vedeva il nome del vino passare dentro
   ai pulsanti. Sui fondi scuri la trasparenza non perdona. */
#volume.aperto #v-piatto {
  background: #2A0F0C; border-color: var(--oro-scuro);
  box-shadow: 0 12px 44px rgba(0,0,0,.55);
}
#v-barra {
  display: flex; align-items: center; gap: calc(var(--passo) * 1.5);
  max-width: 0; opacity: 0; overflow: hidden;
  pointer-events: none;
  transition: max-width .32s var(--curva), opacity .22s var(--curva);
}
#volume.aperto #v-barra { max-width: 640px; opacity: 1; pointer-events: auto; }

/* La scala sale da sinistra a destra anche in ALTEZZA: si legge di sbieco, da
   mezzo metro, senza contare le tacche. */
#v-livello { display: flex; align-items: flex-end; gap: 7px; height: 56px; }
#v-livello i {
  width: 16px; border-radius: 3px;
  height: calc(18px + var(--i) * 4px);
  background: rgba(138,107,48,.34);
  transition: background-color .18s var(--curva);
}
#v-livello i.acceso { background: var(--oro); }
/* A zero il dispositivo racconta lo stesso, in silenzio: la scala si spegne
   tutta e l'altoparlante prende la barra.

   Le due onde dell'icona non sono decorazione: sotto meta' corsa ne resta una,
   a zero nessuna e compare il taglio. Cosi' il livello si sa anche a comando
   chiuso, che e' come sta per tutta la sera. */
#volume.muto #v-apri { color: var(--avorio-fioco); border-color: var(--oro-scuro); }
.altoparlante .onda { transition: opacity .2s; }
#volume.piano .altoparlante .onda.lontana { opacity: 0; }
#volume.muto .altoparlante .onda { opacity: 0; }
.altoparlante .taglio { opacity: 0; transition: opacity .2s; }
#volume.muto .altoparlante .taglio { opacity: 1; }
#volume[hidden] { display: none; }

/* ===========================================================================
   DIDASCALIA — che cosa il dispositivo sta dicendo, adesso.

   Sta in basso, come un sottotitolo, e cambia quando cambia la VOCE: il server
   la manda nel momento in cui una frase comincia a sentirsi, non quando la
   scrive. Fra le due cose ci sono la riserva dell'uscita e il buffer di ALSA,
   cioè mezzo secondo, e su una frase da un secondo mezzo secondo si vede.

   La velatura sotto serve a renderla leggibile su qualunque vista senza
   coprirla: sfuma da trasparente a quasi opaco solo nell'ultimo terzo.
   =========================================================================== */
#didascalia {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 8;
  display: flex; align-items: flex-end; justify-content: center;
  min-height: 168px;
  padding: 0 calc(var(--passo) * 6) calc(var(--passo) * 3);
  font-size: var(--t-invito); line-height: 1.28; color: var(--avorio);
  text-align: center; pointer-events: none;
  background: linear-gradient(transparent 0, rgba(20,16,15,.55) 45%,
                              rgba(20,16,15,.9) 100%);
  opacity: 0; transition: opacity .25s var(--curva);
}
#didascalia.visibile { opacity: 1; }
/* Nel racconto no: il testo c'è già tutto, con la frase in ascolto accesa, e
   una didascalia sarebbe la stessa frase scritta due volte a due centimetri
   di distanza. */
#racconto.attiva ~ #didascalia { display: none; }

/* ===========================================================================
   ANNULLA — chiudere senza dover togliere la bottiglia.

   Fino a qui l'unico modo di finire era sollevare la bottiglia dal piatto. Va
   benissimo quando si ha finito davvero, ma non per chi ha appena versato: il
   vino e' nel bicchiere, la bottiglia sta li', e nessuno la risolleva solo per
   far tacere il dispositivo.

   Sta FUORI dalle viste, come la didascalia. Dentro `#racconto` finirebbe
   sotto `.comandi`, che nonostante i cerchi stiano al centro e' una scatola
   larga tutto lo schermo (left:0; right:0): si mangerebbe il tocco in tutta la
   fascia bassa, e sembrerebbe un difetto del touch invece che una
   sovrapposizione.

   In basso a SINISTRA perche' l'angolo destro e' gia' il gesto da tre secondi
   che apre lo stato tecnico. A sinistra il posto c'e', ma e' stretto: le righe
   di scelta della conferma cominciano a 170 e la colonna del testo a 140. Ci
   sta un cerchio da 108, non una pillola con la scritta - «Annulla» a 34 px
   misura 110 px, che col contorno fanno 180. La scritta tradotta resta come
   nome accessibile.
   =========================================================================== */
#annulla {
  position: absolute; left: calc(var(--passo) * 2); z-index: 8;
  /* Sulla stessa riga dei cerchi del racconto. Il loro `bottom` dichiarato e'
     il fondo della SCATOLA, alta 140, con dentro cerchi da 108 centrati: il
     fondo dei cerchi sta mezza differenza piu' su. Prendendo il valore
     dichiarato si resterebbe sedici pixel piu' in basso. */
  bottom: calc(var(--passo) * 2.8 + (var(--tocco-grande) - var(--tocco)) / 2);
  /* Tono spento come «Nessuno di questi»: e' una via d'uscita, non un comando
     del racconto, e non deve pesare quanto la pausa. */
  border-color: rgba(138, 107, 48, .45); color: var(--avorio-tenue);
  opacity: 0; visibility: hidden; pointer-events: none;
  /* La visibilita' NON si interpola, per la stessa ragione delle viste: per
     quattro decimi di secondo un pulsante invisibile resterebbe vivo sopra la
     schermata d'invito, dove un tocco non deve fare niente. */
  transition: opacity .3s var(--curva), visibility 0s linear .3s,
              transform .12s var(--curva), background-color .2s, border-color .2s;
}
#annulla.disponibile {
  opacity: 1; visibility: visible; pointer-events: auto;
  transition: opacity .3s var(--curva), visibility 0s,
              transform .12s var(--curva), background-color .2s, border-color .2s;
}
/* Il ritorno al tocco va ridichiarato: `#annulla` ha specificita' 1-1-0 e
   batte `.cmd.premuto`, che ne ha 0-2-0. Senza queste due righe il bordo
   smette di accendersi sotto il dito, in silenzio. */
#annulla.premuto {
  background: rgba(200, 134, 13, .16); border-color: var(--oro-chiaro);
}

/* ===========================================================================
   SERVIZIO — cose che si vedono solo quando qualcosa non va.
   =========================================================================== */
/* Quando non c'e' voce non c'e' niente da comandare: i pulsanti spariscono
   invece di restare accesi e inerti sotto le dita di chi li prova, e l'avviso
   si prende il posto loro. Prima era stampato ATTRAVERSO la barra di
   avanzamento e sul bordo dei pulsanti. */
#racconto.senza-voce .comandi,
#racconto.senza-voce .progresso { display: none; }
#muto {
  position: absolute; left: 0; right: 0; bottom: calc(var(--passo) * 2);
  text-align: center;
  font-size: var(--t-sottotit); color: var(--avorio-tenue);
  opacity: 0; transition: opacity .3s; pointer-events: none;
}
#muto.visibile { opacity: 1; }
#spia {
  position: absolute; right: 10px; bottom: 8px; width: 8px; height: 8px;
  border-radius: 50%; background: var(--oro-scuro); opacity: .3;
  pointer-events: none;
}
#spia.rotto { background: var(--errore-luce); opacity: .95; }

/* Lo stato tecnico si APRE SOPRA la scena, non ci si naviga. Prima era un
   `location.href`: su un chiosco senza barra degli indirizzi, senza tasto
   indietro e senza tastiera, chi ci finiva restava su un blocco di JSON finche'
   qualcuno non entrava da remoto - e il flusso degli eventi, cioe' il racconto
   in corso, moriva li'. */
#angolo { position: absolute; right: 0; bottom: 0; width: 110px; height: 110px; z-index: 7; }
/* Il pannello delle impostazioni. Ci si arriva dallo stesso gesto da tre
   secondi nell'angolo in basso a destra che prima apriva lo stato tecnico: un
   ingresso nascosto basta e avanza, e i tre secondi con lo scarto che annulla
   sono cio' che tiene fuori la mano dell'ospite che appoggia una bottiglia.
   Lo stato tecnico e' diventato una riga qui dentro. */
#impostazioni {
  position: absolute; inset: 0; z-index: 9; background: var(--carbone);
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: var(--passo);
  padding: calc(var(--passo) * 2) calc(var(--passo) * 3);
}
#impostazioni[hidden] { display: none; }
#i-titolo {
  font-size: var(--t-titolo, 46px); color: var(--oro); margin-bottom: var(--passo);
}
.i-riga {
  width: min(860px, 88%); min-height: var(--tocco);
  display: flex; align-items: center; justify-content: space-between;
  gap: calc(var(--passo) * 2); padding: calc(var(--passo) / 1.5) var(--passo);
  background: none; border: 2px solid rgba(200,134,13,.45);
  border-radius: var(--raggio); color: var(--avorio);
  font: inherit; text-align: left;
}
.i-riga.premuto { background: rgba(200,134,13,.2); border-color: var(--oro-chiaro); }
.i-nome { font-size: var(--t-scelta); }
/* La spiegazione dice il PREZZO, non la lode: chi accende deve sapere che
   costa un'attesa, altrimenti la prima bottiglia sembra un guasto. */
.i-spiega {
  font-size: calc(var(--t-scelta) * .62); color: rgba(244,237,227,.62);
  margin-top: calc(var(--passo) / 3); max-width: 620px; line-height: 1.35;
}
.i-interruttore {
  flex: none; width: 104px; height: 56px; border-radius: 28px;
  background: rgba(244,237,227,.16); border: 2px solid rgba(244,237,227,.3);
  position: relative; transition: background .18s, border-color .18s;
}
.i-pallina {
  position: absolute; top: 4px; left: 4px; width: 44px; height: 44px;
  border-radius: 50%; background: var(--avorio); transition: transform .18s;
}
.i-riga.acceso .i-interruttore {
  background: rgba(200,134,13,.55); border-color: var(--oro);
}
.i-riga.acceso .i-pallina { transform: translateX(48px); }
/* Senza modello acceso l'interruttore non si mostra: un comando che non fa
   niente e' peggio di nessun comando. E' lo stesso criterio del volume. */
#i-generate[hidden] { display: none; }

/* Il mirino. Occupa tutto il vetro perche' quello che si sta guardando e'
   l'inquadratura: ridurla per far posto a una cornice vorrebbe dire tarare
   una cosa guardandone un'altra. Il testo sta di fianco, e sotto i 900 px va
   sotto - su un vetro da 800x480 l'immagine resta comunque la meta' larga. */
#mirino {
  position: absolute; inset: 0; z-index: 10; background: #0d0a09;
  display: flex; gap: calc(var(--passo) * 1.5);
  padding: var(--passo); align-items: stretch;
}
#mirino[hidden] { display: none; }
/* Il video sta IN PIEDI, perche' in piedi sta la bottiglia: la camera e'
   montata di lato e il fotogramma raddrizzato e' 1080x1920. Dargli i due terzi
   della larghezza, come quando era orizzontale, vorrebbe dire una striscia
   alta 700 px e larga 830 con dentro un'immagine larga 394: metà del vetro
   spesa in bordi neri. Qui prende l'altezza e si tiene la sua proporzione. */
#m-video {
  flex: 0 1 auto; min-width: 0; min-height: 0; height: 100%; width: auto;
  object-fit: contain; border-radius: var(--raggio); background: #000;
}
#m-lato {
  flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column;
  gap: calc(var(--passo) / 1.5); color: var(--avorio);
  font-size: calc(var(--t-scelta) * .5); line-height: 1.3;
}
/* Scorre il CORPO, non il pannello. Il pulsante di ritorno sta fuori da qui e
   non si muove: su una parete piena di scritte l'OCR trova quaranta righe, e
   con il pulsante dentro all'elenco l'unica via d'uscita dal mirino finiva
   sotto il bordo dello schermo. Su un dispositivo senza tastiera, quello non
   e' un difetto di impaginazione: e' restarci chiusi dentro. */
#m-corpo { flex: 1 1 auto; min-height: 0; overflow: auto; }
#m-corpo::-webkit-scrollbar { display: none; }
#m-lato h3 {
  margin: 0 0 .3em; font-size: calc(var(--t-scelta) * .42);
  letter-spacing: .14em; text-transform: uppercase; color: var(--oro);
  font-weight: 600;
}
#m-lato h3:not(:first-child) { margin-top: .8em; }
#m-lato p { margin: .2em 0; }
#m-lato ul { margin: 0; padding-left: 1.1em; }
#m-lato li { margin: .1em 0; }
#m-lato code {
  background: rgba(244,237,227,.09); padding: 0 5px; border-radius: 4px;
}
#m-lato .certo { color: #5CDC7A; }
#m-lato .dubbio { color: #FF9628; }
#m-lato .nulla { color: #EE5F4F; }
#m-lato .fioco { color: rgba(244,237,227,.6); }
#m-torna {
  flex: none; min-height: var(--tocco);
  display: flex; align-items: center; justify-content: center;
  font-size: calc(var(--t-scelta) * .8); color: var(--avorio);
  border: 2px solid var(--oro); border-radius: var(--raggio);
}
#m-torna.premuto { background: rgba(200,134,13,.2); border-color: var(--oro-chiaro); }
/* Su un vetro basso e largo il video in piedi non ci sta in altezza: allora
   si arrende alla larghezza, invece di sbordare. */
@media (max-height: 520px) {
  #m-video { height: auto; width: auto; max-width: 45%; flex: 0 1 auto; }
}

#diagnostica {
  position: absolute; inset: 0; z-index: 9; background: var(--carbone);
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: var(--passo); padding: calc(var(--passo) * 3);
}
#diagnostica[hidden] { display: none; }
#d-corpo {
  font-family: ui-monospace, monospace; font-size: 26px; line-height: 1.4;
  color: var(--avorio); max-height: 70%; overflow: auto; white-space: pre-wrap;
}
#d-corpo::-webkit-scrollbar { display: none; }
#d-chiudi, #i-chiudi {
  min-width: calc(var(--tocco) * 2.5); height: var(--tocco);
  display: flex; align-items: center; justify-content: center;
  font-size: var(--t-scelta); color: var(--avorio);
  border: 2px solid var(--oro); border-radius: var(--raggio);
}
#d-chiudi.premuto, #i-chiudi.premuto { background: rgba(200,134,13,.2); border-color: var(--oro-chiaro); }
</style>
</head>
<body>
<div id="scena">

  <div id="lingue"></div>

  <!-- VOLUME -->
  <div id="volume" hidden>
    <div id="v-piatto">
      <button class="cmd" id="v-apri" aria-label="Volume">
        <svg class="altoparlante" viewBox="0 0 24 24">
          <path d="M4 9v6h4l5 4V5L8 9H4z"/>
          <path class="onda" d="M16.5 8.5a5 5 0 0 1 0 7v-1.9a3.2 3.2 0 0 0 0-3.2V8.5z"/>
          <path class="onda lontana" d="M19 6a8.5 8.5 0 0 1 0 12v-1.9a6.6 6.6 0 0 0 0-8.2V6z"/>
          <path class="taglio" d="M3.5 3.5 L20.5 20.5" fill="none"
                stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </button>
      <div id="v-barra">
        <button class="cmd" id="v-giu" aria-label="Piu' piano">
          <svg viewBox="0 0 24 24"><path d="M5 11h14v2H5z"/></svg>
        </button>
        <div id="v-livello"></div>
        <button class="cmd" id="v-su" aria-label="Piu' forte">
          <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ATTESA -->
  <section id="attesa" class="vista attiva">
    <svg class="marchio" viewBox="0 0 100 100" aria-hidden="true">
      <g class="mirino">
        <path d="M9 29 V17 A8 8 0 0 1 17 9 H29"/>
        <path d="M71 9 H83 A8 8 0 0 1 91 17 V29"/>
        <path d="M91 71 V83 A8 8 0 0 1 83 91 H71"/>
        <path d="M29 91 H17 A8 8 0 0 1 9 83 V71"/>
      </g>
      <!-- La bottiglia: collo, spalla, corpo. Il fondo è arrotondato appena,
           quanto basta perché non sembri una scatola. -->
      <path class="bottiglia"
            d="M45 20 H55 V37 C55 41 66 45 66 55 V83
               A3.5 3.5 0 0 1 62.5 86.5 H37.5
               A3.5 3.5 0 0 1 34 83 V55 C34 45 45 41 45 37 Z"/>
      <path class="bottiglia" d="M45 26 H55"/>
      <!-- La A sta dentro il corpo della bottiglia, dove sta l'etichetta. -->
      <path class="lettera" d="M41.5 80.5 L50 57 L58.5 80.5 M44.7 71.6 H55.3"/>
    </svg>
    <div class="nome">Amelie</div>
    <div class="filo"></div>
    <div class="invito" id="invito">Appoggi una bottiglia</div>
  </section>

  <!-- LAVORO -->
  <section id="lavoro" class="vista">
    <svg class="calice" viewBox="0 0 100 124" aria-hidden="true">
      <defs>
        <!-- Il vino esiste solo dentro la coppa: fuori non si vede salire. -->
        <clipPath id="coppa">
          <path d="M30 13 C30 43 37.5 58 50 58 C62.5 58 70 43 70 13 Z"/>
        </clipPath>
      </defs>
      <g clip-path="url(#coppa)">
        <g class="livello">
          <rect class="vino" x="22" y="16" width="56" height="54"/>
          <ellipse class="pelo" cx="50" cy="16" rx="28" ry="2.4"/>
        </g>
      </g>
      <!-- Coppa a tulipano: larga all'orlo, raccolta sul fondo. -->
      <path class="vetro" d="M30 13 C30 43 37.5 58 50 58 C62.5 58 70 43 70 13"/>
      <path class="vetro" d="M30 13 H70"/>
      <path class="vetro" d="M50 58 V97"/>
      <ellipse class="vetro" cx="50" cy="103" rx="17" ry="5.5"/>
    </svg>
    <div class="frase" id="frase-lavoro">Sto leggendo l'etichetta…</div>
  </section>

  <!-- RACCONTO -->
  <section id="racconto" class="vista">
    <header class="intestazione">
      <div class="titolo"   id="r-titolo"></div>
      <div class="sottotit" id="r-sottotitolo"></div>
    </header>
    <div class="testo" id="r-testo"></div>
    <div class="comandi" id="r-comandi">
      <button class="cmd" data-azione="ricomincia" aria-label="Da capo">
        <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.3 0 6 2.7 6 6s-2.7 6-6 6-6-2.7-6-6H4c0 4.4 3.6 8 8 8s8-3.6 8-8-3.6-8-8-8z"/></svg>
      </button>
      <button class="cmd" data-azione="indietro" aria-label="Indietro">
        <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
      </button>
      <button class="cmd grande" data-azione="alterna" id="r-alterna" aria-label="Pausa">
        <svg id="r-icona" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
      </button>
      <button class="cmd" data-azione="avanti" aria-label="Avanti">
        <svg viewBox="0 0 24 24"><path d="M13 6v12l8.5-6L13 6zm-.5 6L4 6v12l8.5-6z"/></svg>
      </button>
    </div>
    <div class="progresso"><div class="riempito" id="r-progresso"></div></div>
  </section>

  <!-- CONFERMA -->
  <section id="conferma" class="vista">
    <div class="domanda" id="domanda">Quale di questi?</div>
    <div class="scelte" id="c-scelte"></div>
  </section>

  <!-- AVVISO -->
  <section id="avviso" class="vista">
    <div class="simbolo" id="a-simbolo">↻</div>
    <div class="frase"   id="a-frase"></div>
  </section>

  <div id="didascalia"></div>
  <!-- Dopo la didascalia, cosi' a parita' di z-index vince sulla sua velatura
       e resta leggibile anche quando c'e' una didascalia accesa sotto. -->
  <button class="cmd" id="annulla" aria-label="Annulla">
    <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
  </button>
  <div id="muto"></div>
  <div id="spia"></div>
  <div id="angolo"></div>

  <section id="impostazioni" hidden>
    <div id="i-titolo">Impostazioni</div>
    <button class="i-riga" id="i-generate">
      <div>
        <div class="i-nome" id="i-generate-nome">Descrizioni generate</div>
        <div class="i-spiega" id="i-generate-spiega"></div>
      </div>
      <div class="i-interruttore"><div class="i-pallina"></div></div>
    </button>
    <button class="i-riga" id="i-mirino">
      <div>
        <div class="i-nome" id="i-mirino-nome">Mirino</div>
        <div class="i-spiega" id="i-mirino-spiega"></div>
      </div>
      <div class="i-interruttore"><div class="i-pallina"></div></div>
    </button>
    <button class="i-riga" id="i-stato">
      <div class="i-nome" id="i-stato-nome">Stato tecnico</div>
    </button>
    <div id="i-chiudi">chiudi</div>
  </section>

  <section id="mirino" hidden>
    <img id="m-video" alt="">
    <div id="m-lato">
      <div id="m-corpo"></div>
      <div id="m-torna">torna al racconto</div>
    </div>
  </section>

  <section id="diagnostica" hidden>
    <pre id="d-corpo"></pre>
    <div id="d-chiudi">chiudi</div>
  </section>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const viste = ["attesa", "lavoro", "racconto", "conferma", "avviso"];
/* Le scritte che arrivano dal server e servono a piu' di un posto. Stanno qui
   perche' il messaggio che le porta arriva a ogni cambio di lingua, e chi le
   usa puo' essere disegnato molto dopo. */
const parole = {};

/* Un chiosco non deve mai comportarsi da pagina: niente menu contestuale al
   tocco lungo, niente trascinamento, niente ingrandimento a due dita. Sono
   difetti che si vedono solo con un dito vero su un tavolo vero. */
for (const evento of ["contextmenu", "dragstart", "gesturestart", "selectstart"]) {
  document.addEventListener(evento, (e) => e.preventDefault(), { passive: false });
}

/* La scena è disegnata per 1280x720 e ci resta: qui si calcola di quanto va
   ridotta per stare nel pannello, qualunque risoluzione gli venga data. Sul
   minore dei due rapporti, perché 800x480 è 5:3 e il disegno è 16:9: scalando
   sulla sola larghezza il fondo del racconto finirebbe fuori dal vetro. */
function adattaScena() {
  const k = Math.min(innerWidth / 1280, innerHeight / 720);
  document.documentElement.style.setProperty("--scala", k);
}
adattaScena();
addEventListener("resize", adattaScena);

/* Le due sole schermate in cui il dispositivo sta aspettando l'ospite, ed e'
   quindi lecito chiudere: la scelta fra candidati e il racconto. Nelle altre
   non c'e' niente da annullare - in attesa si e' gia' a casa, e durante la
   lettura fermarsi a meta' lascerebbe l'OCR a girare. */
const VISTE_ANNULLABILI = ["conferma", "racconto"];

function mostra(nome) {
  viste.forEach(v => $(v).classList.toggle("attiva", v === nome));
  $("annulla").classList.toggle("disponibile", VISTE_ANNULLABILI.includes(nome));
}

/* Quello che il dispositivo sta dicendo, adesso. Arriva già temporizzato: il
   server la manda quando la frase comincia a sentirsi, non quando la scrive. */
function didascalia(testo) {
  const d = $("didascalia");
  d.textContent = testo || "";
  d.classList.toggle("visibile", !!testo);
}

/* Senza voce non c'è niente da comandare: i pulsanti spariscono e l'avviso
   prende il loro posto, invece di lasciarli accesi e morti sotto le dita. */
function segnaVoceMuta(muta) {
  $("muto").classList.toggle("visibile", muta);
  $("racconto").classList.toggle("senza-voce", muta);
}

/* --------------------------------------------------------------- racconto */

let frasi = [];          /* gli span, uno per frase */
let viva = -1;           /* quale è illuminata adesso */

function componiRacconto(elenco) {
  const t = $("r-testo");
  t.innerHTML = "";
  frasi = (elenco || []).map(testo => {
    const s = document.createElement("span");
    s.className = "frase";
    s.textContent = testo + " ";
    t.appendChild(s);
    return s;
  });
  viva = -1;
  t.scrollTop = 0;
  avanzamento(0);
}

function illumina(i) {
  if (i === viva || i < 0 || i >= frasi.length) return;
  if (frasi[viva]) frasi[viva].classList.remove("viva");
  viva = i;
  frasi[viva].classList.add("viva");
  /* Il testo scorre dietro alla voce: chi ascolta non deve trascinare nulla. */
  frasi[viva].scrollIntoView({ block: "center", behavior: "smooth" });
}

function avanzamento(quota) {
  $("r-progresso").style.transform = "scaleX(" + Math.max(0, Math.min(1, quota)) + ")";
}

const ICONA_PAUSA = "M6 4h4v16H6zM14 4h4v16h-4z";
const ICONA_PLAY  = "M8 5v14l11-7z";
let inPausa = false;
function segnaPausa(valore) {
  inPausa = valore;
  $("r-icona").firstElementChild.setAttribute("d", valore ? ICONA_PLAY : ICONA_PAUSA);
  $("r-alterna").setAttribute("aria-label", valore ? "Riprendi" : "Pausa");
}

/* ------------------------------------------------------------------ tocco */

/* Un solo posto in cui si decide che cosa è toccabile. Tutto il resto dello
   schermo è inerte di proposito: su un tavolo di ristorante un tocco
   accidentale è la norma, non l'eccezione. */
function rendiToccabile(elemento, azione) {
  elemento.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    elemento.classList.add("premuto");
  });
  for (const evento of ["pointerup", "pointercancel", "pointerleave"]) {
    elemento.addEventListener(evento, () => elemento.classList.remove("premuto"));
  }
  /* Si agisce al RILASCIO, e solo se il dito è ancora sopra: così un tocco
     partito per sbaglio si annulla scivolando via, come su ogni cosa fatta
     bene.

     Il confronto è sul RIQUADRO DI PARTENZA, non su elementFromPoint: mentre
     il dito preme, il pulsante è rimpicciolito al 93% dal ritorno visivo, e
     chiedere "che cosa c'è sotto questo punto" misurava il dito contro un
     bersaglio più piccolo di quello che l'occhio vede. Ne nasceva un anello
     morto di quattro pixel tutt'intorno, proprio dove il dito arriva quando
     si tocca senza guardare. */
  elemento.addEventListener("pointerdown", (e) => {
    elemento._riquadro = elemento.getBoundingClientRect();
    try { elemento.setPointerCapture(e.pointerId); } catch { /* poco importa */ }
  });
  elemento.addEventListener("pointerup", (e) => {
    const r = elemento._riquadro;
    if (!r) return;
    const dentro = e.clientX >= r.left && e.clientX <= r.right &&
                   e.clientY >= r.top  && e.clientY <= r.bottom;
    elemento._riquadro = null;
    if (dentro) azione();
  });
}

/* Il filtro anti-rimbalzo è PER AZIONE, e parte da meno infinito: con uno
   zero condiviso, il primo tocco nei primi duecento millesimi di vita della
   pagina veniva scartato in silenzio, e "indietro" seguito da "avanti" perdeva
   il secondo. */
const ultimoComando = {};
function comanda(azione) {
  const ora = performance.now();
  if (ora - (ultimoComando[azione] ?? -Infinity) < 220) return;
  ultimoComando[azione] = ora;

  fetch("/racconto/" + azione, { method: "POST" })
    .then(r => r.json())
    .then(d => {
      /* Il server dice se c'era qualcosa da comandare. Un pulsante che non può
         fare niente si spegne: acceso e inerte è peggio di assente — a racconto
         finito quello che l'ospite cerca è proprio "da capo", e restava lì a
         piena luce senza nemmeno un lampo di rifiuto. */
      spegniComandi(d.ok === false);
      if (d.ok !== false && "in_pausa" in d) segnaPausa(d.in_pausa === true);
    })
    .catch(() => {});

  /* L'icona cambia SUBITO, senza aspettare la risposta: su un tavolo un
     pulsante che risponde fra duecento millesimi sembra rotto. La risposta
     conferma o corregge. */
  if (azione === "alterna")   segnaPausa(!inPausa);
  if (azione === "ricomincia") { segnaPausa(false); avanzamento(0); }
}

function spegniComandi(spenti) {
  document.querySelectorAll("#r-comandi .cmd").forEach(b => { b.disabled = spenti; });
}

document.querySelectorAll("#r-comandi .cmd").forEach(b => {
  rendiToccabile(b, () => comanda(b.dataset.azione));
});

/* --------------------------------------------------------------- volume */

/* Quanto resta aperto senza che nessuno lo tocchi. Quattro secondi e mezzo:
   il tempo di due pressioni e un'occhiata, non tanto da restare in mezzo alla
   schermata dopo che ci si è dimenticati di lui. */
const VOLUME_RIPOSO_MS = 4500;
const TACCHE = 10;

let volume = 100;
let passoVolume = 10;
let chiusuraVolume = null;

/* La scala si costruisce una volta sola: dieci tacche che crescono in altezza,
   così il livello si legge di sbieco senza contarle. */
(function costruisciScala() {
  const box = $("v-livello");
  for (let i = 0; i < TACCHE; i++) {
    const t = document.createElement("i");
    t.style.setProperty("--i", i);
    box.appendChild(t);
  }
})();

function disegnaVolume(valore) {
  volume = Math.max(0, Math.min(100, valore));
  const accese = Math.round(volume / 100 * TACCHE);
  $("v-livello").querySelectorAll("i").forEach((t, i) => {
    t.classList.toggle("acceso", i < accese);
  });
  $("volume").classList.toggle("muto", volume <= 0);
  $("volume").classList.toggle("piano", volume > 0 && volume < 50);
  $("v-giu").disabled = volume <= 0;
  $("v-su").disabled = volume >= 100;
}

function rinviaChiusura() {
  clearTimeout(chiusuraVolume);
  chiusuraVolume = setTimeout(chiudiVolume, VOLUME_RIPOSO_MS);
}

function chiudiVolume() {
  clearTimeout(chiusuraVolume);
  $("volume").classList.remove("aperto");
}

function alternaVolume() {
  const aperto = $("volume").classList.toggle("aperto");
  if (aperto) rinviaChiusura(); else clearTimeout(chiusuraVolume);
}

function regolaVolume(delta) {
  rinviaChiusura();
  /* Il livello si muove SUBITO e la risposta conferma: il colpetto che fa
     sentire il volume arriva un terzo di secondo dopo, di proposito, e nel
     frattempo la scala deve già aver risposto al dito. */
  const chiesto = Math.max(0, Math.min(100, volume + delta));
  if (chiesto === volume) return;
  disegnaVolume(chiesto);
  fetch("/volume/" + chiesto, { method: "POST" })
    .then(r => r.json())
    .then(d => { if (typeof d.valore === "number") disegnaVolume(d.valore); })
    .catch(() => {});
}

rendiToccabile($("v-apri"), alternaVolume);
/* Rotta a se', non un'azione del racconto: `comanda()` parla con
   `/racconto/<azione>`, e quella rotta non fa NIENTE quando non c'e' un
   riproduttore acceso - cioe' in tutta la schermata di conferma, nei due
   secondi dopo la fine, e quando la lingua non ha voce. Il pulsante sarebbe
   morto proprio nei casi in cui serve di piu'. */
rendiToccabile($("annulla"), () => fetch("/annulla", { method: "POST" }).catch(() => {}));

rendiToccabile($("v-giu"), () => regolaVolume(-passoVolume));
rendiToccabile($("v-su"),  () => regolaVolume(+passoVolume));

/* --------------------------------------------------------------- lingue */

/* L'elenco lo disegna il server: sa quali lingue esistono e come si chiamano
   le scritte fisse. La pagina non tiene un proprio elenco, così aggiungere
   una lingua è un file JSON e nient'altro. */
function disegnaLingue(m) {
  document.documentElement.lang = m.lingua || "it";
  if (m.invito)  $("invito").textContent  = m.invito;
  if (m.domanda) $("domanda").textContent = m.domanda;
  if (m.avviso_muto) $("muto").textContent = m.avviso_muto;
  /* Il nome del pulsante non e' scritto nella pagina: arriva tradotto come
     tutte le altre scritte fisse. Sul cerchio c'e' solo la croce, ma il nome
     accessibile deve dire in che lingua si sta parlando. */
  if (m.annulla) $("annulla").setAttribute("aria-label", m.annulla);
  segnaVoceMuta(m.voce_muta === true);

  const box = $("lingue");
  const codici = m.disponibili || [];
  if (codici.length < 2) { box.innerHTML = ""; return; }

  box.innerHTML = "";
  codici.forEach(codice => {
    const b = document.createElement("div");
    b.className = "lingua" + (codice === m.lingua ? " corrente" : "");
    b.textContent = codice.toUpperCase();
    rendiToccabile(b, () => fetch("/lingua/" + codice, { method: "POST" }).catch(() => {}));
    box.appendChild(b);
  });
}

/* --------------------------------------------------------------- eventi */

const eventi = new EventSource("/eventi");

eventi.onmessage = (e) => {
  let m;
  try { m = JSON.parse(e.data); } catch { return; }

  switch (m.tipo) {
    case "stato":
      if (m.vista === "racconto") {
        $("r-titolo").textContent = m.titolo || "";
        $("r-sottotitolo").textContent = m.sottotitolo || "";
        /* Il testo si svuota QUI, non quando arriva quello nuovo: fra il
           cambio di vista e la prima frase passa qualche decimo, e in quel
           buco si leggerebbe ancora il vino di prima.
           Ma non quando il racconto e' lo STESSO: la schermata resta accesa
           anche nei due secondi che seguono la fine, e li' non c'e' nessun
           vino di prima da nascondere - c'e' quello che si e' appena
           ascoltato. Svuotandola, l'ospite guardava due secondi di schermo
           vuoto ogni volta che una storia finiva. */
        if (!m.stesso_racconto) componiRacconto([]);
      }
      if (m.vista === "lavoro" && m.frase) $("frase-lavoro").textContent = m.frase;
      if (m.vista === "avviso") {
        $("a-frase").textContent = m.frase || "";
        $("a-simbolo").textContent = m.simbolo || "↻";
        /* Il tono lo decide il server, che sa se sta chiedendo qualcosa o
           dichiarando un guasto. Prima erano tutti dello stesso oro. */
        $("avviso").className = "vista " + (m.tono || "invito");
      }
      if ("voce_muta" in m) segnaVoceMuta(m.voce_muta === true);
      /* Cambiando scena si tace: una didascalia rimasta accesa parlerebbe di
         una bottiglia che non c'è più. */
      didascalia("");
      /* E il comando del volume si richiude: aperto sopra il titolo di un vino
         appena riconosciuto non ci deve restare. */
      chiudiVolume();
      mostra(m.vista);
      break;

    case "racconto":
      componiRacconto(m.frasi);
      segnaPausa(false);
      spegniComandi(false);
      break;

    case "riproduzione":
      illumina(m.frase || 0);
      segnaPausa(m.in_pausa === true);
      /* La quota la calcola il server, che e' l'unico a sapere quanto dura
         il racconto INTERO. Qui si divideva posizione per durata, ma quella
         durata era «quanto e' gia' sintetizzato»: cresceva sotto i piedi del
         numeratore e la barra tornava indietro a ogni frase nuova. */
      if (typeof m.quota === "number") avanzamento(m.quota);
      break;

    case "candidati": {
      const box = $("c-scelte");
      box.innerHTML = "";
      (m.voci || []).forEach((voce, i) => {
        const b = document.createElement("div");
        b.className = "scelta";
        b.textContent = voce;
        rendiToccabile(b, () => fetch("/scegli/" + i, { method: "POST" }).catch(() => {}));
        box.appendChild(b);
      });
      /* «Nessuno di questi». È l'unico caso che il dispositivo non può
         risolvere da solo — un'etichetta letta male, un vino che nel database
         non c'è — e senza questo bottone quel caso sparisce: l'ospite tocca a
         caso o aspetta, e chi deve correggere non sa nemmeno che è successo.
         Toccandolo si mette da parte lo scatto per guardarlo dopo, e il
         racconto va avanti lo stesso col più generico che si sa dire. */
      const n = document.createElement("div");
      n.className = "scelta nessuno";
      n.textContent = m.nessuno || "Nessuno di questi";
      rendiToccabile(n, () => fetch("/segnala", { method: "POST" }).catch(() => {}));
      box.appendChild(n);
      break;
    }

    case "didascalia":
      didascalia(m.testo);
      break;

    case "lingua":
      disegnaLingue(m);
      if (m.impostazioni) {
        $("i-titolo").textContent = m.impostazioni.impostazioni;
        $("i-generate-nome").textContent = m.impostazioni.descrizioni_generate;
        $("i-generate-spiega").textContent = m.impostazioni.generate_spiega;
        $("i-mirino-nome").textContent = m.impostazioni.mirino;
        $("i-mirino-spiega").textContent = m.impostazioni.mirino_spiega;
        $("m-torna").textContent = m.impostazioni.mirino_torna;
        parole.mirino = { legge: m.impostazioni.mirino_legge,
                          trova: m.impostazioni.mirino_trova,
                          niente: m.impostazioni.mirino_niente };
        $("i-stato-nome").textContent = m.impostazioni.stato_tecnico;
        $("i-chiudi").textContent = m.impostazioni.chiudi;
        $("d-chiudi").textContent = m.impostazioni.chiudi;
      }
      break;

    case "volume":
      /* Senza voce del tutto — il dispositivo avviato con --senza-voce — il
         comando non c'è: un livello che non muove niente è peggio di nessun
         livello. */
      $("volume").hidden = m.attivo === false;
      if (typeof m.passo === "number") passoVolume = m.passo;
      if (typeof m.valore === "number") disegnaVolume(m.valore);
      break;

    case "impostazioni":
      disegnaImpostazioni(m);
      break;

    case "mirino":
      disegnaMirino(m);
      break;

    case "salute":
      $("spia").classList.toggle("rotto", !m.tutto_bene);
      segnaVoceMuta(m.voce_muta === true);
      break;
  }
};

/* Se il server cade, EventSource riprova da solo. Si segnala e basta: un
   riavvio della pagina perderebbe il racconto in corso. */
eventi.onerror = () => $("spia").classList.add("rotto");

/* Lo stato tecnico, per il collaudo senza tastiera. Si APRE sopra la scena e
   non ci si naviga: andarsene da questa pagina, su un chiosco senza barra degli
   indirizzi, significa non tornare più indietro e perdere il flusso di eventi.

   Tre secondi fermi, con una tolleranza di movimento. Senza la tolleranza il
   gesto era rovesciato: il centro del contatto su un capacitivo non calibrato
   oscilla di continuo, quindi non si completava mai per chi lo cercava — e
   poteva completarsi da solo sotto una mano appoggiata immobile sul bordo. */
const ANGOLO_TENUTA = 3000;
const ANGOLO_SCARTO = 30;
let gesto = null;

function annullaGesto() {
  if (gesto) { clearTimeout(gesto.t); gesto = null; }
}

function apriImpostazioni() {
  gesto = null;
  $("impostazioni").hidden = false;
}

function apriDiagnostica() {
  $("d-corpo").textContent = "…";
  fetch("/stato").then(r => r.json())
    .then(d => { $("d-corpo").textContent = JSON.stringify(d, null, 2); })
    .catch(e => { $("d-corpo").textContent = "stato non leggibile: " + e; });
  $("diagnostica").hidden = false;
}

/* Le descrizioni generate. `modelloAcceso` e' falso quando il dispositivo gira
   senza modello: allora la riga non si mostra affatto. */
let generatiAccesi = false;

function disegnaImpostazioni(m) {
  if (typeof m.generati === "boolean") generatiAccesi = m.generati;
  if (typeof m.modello === "boolean") $("i-generate").hidden = !m.modello;
  $("i-generate").classList.toggle("acceso", generatiAccesi);
  $("i-generate").setAttribute("aria-pressed", String(generatiAccesi));
}

(function preparaImpostazioni() {
  rendiToccabile($("i-generate"), () => {
    /* Si disegna subito e si chiede dopo: al tocco l'interruttore deve
       muoversi, non aspettare la rete. Se la richiesta fallisce, il messaggio
       di ritorno del server rimette le cose come stanno. */
    generatiAccesi = !generatiAccesi;
    disegnaImpostazioni({});
    fetch("/generati/" + (generatiAccesi ? 1 : 0), { method: "POST" })
      .then(r => r.json())
      .then(d => disegnaImpostazioni(d))
      .catch(() => { generatiAccesi = !generatiAccesi; disegnaImpostazioni({}); });
  });
  rendiToccabile($("i-mirino"), () => chiediMirino(!mirinoAcceso));
  rendiToccabile($("i-stato"), apriDiagnostica);
  rendiToccabile($("i-chiudi"), () => { $("impostazioni").hidden = true; });
})();

/* --------------------------------------------------------------- mirino */

/* Il mirino: il dispositivo smette di raccontare e mostra cosa vede la camera,
   con sopra il riquadro che va all'OCR e la nitidezza misurata dentro di lui.
   Si accende dal pannello e si spegne da li' o dal pulsante grande, che e'
   l'unico modo di tornare indietro quando il pannello non si vede piu'.

   Il video e' un multipart che il browser tiene aperto: quando si spegne, il
   src va SVUOTATO. Lasciarlo vuol dire una connessione appesa per sempre a un
   flusso che non manda piu' niente, e al riaccendersi il browser mostrerebbe
   l'ultimo fotogramma della volta prima come se fosse adesso. */
let mirinoAcceso = false;
let mirinoOrologio = null;
/* Quante righe si mostrano. Un'etichetta ne da' tre o cinque; una parete con
   un calendario dietro ne da' quaranta, e mostrarle tutte spinge fuori
   schermo la cosa per cui si e' aperto il mirino. Le altre si contano. */
const RIGHE_MOSTRATE = 10;

function chiediMirino(acceso) {
  fetch("/mirino/" + (acceso ? 1 : 0), { method: "POST" })
    .then(r => r.json())
    .then(disegnaMirino)
    .catch(() => { /* il messaggio di stato rimettera' le cose a posto */ });
}

function disegnaMirino(m) {
  if (typeof m.acceso !== "boolean") return;
  mirinoAcceso = m.acceso;
  if (typeof m.disponibile === "boolean") $("i-mirino").hidden = !m.disponibile;
  $("i-mirino").classList.toggle("acceso", mirinoAcceso);
  $("i-mirino").setAttribute("aria-pressed", String(mirinoAcceso));
  $("mirino").hidden = !mirinoAcceso;
  if (mirinoAcceso) {
    $("impostazioni").hidden = true;
    $("diagnostica").hidden = true;
    $("m-video").src = "/mirino/flusso?" + Date.now();
    aggiornaLettura();
    if (!mirinoOrologio) mirinoOrologio = setInterval(aggiornaLettura, 1200);
  } else {
    $("m-video").removeAttribute("src");
    if (mirinoOrologio) { clearInterval(mirinoOrologio); mirinoOrologio = null; }
  }
}

const sicuro = (s) => String(s).replace(/[<&]/g, c => c === "<" ? "&lt;" : "&amp;");

function aggiornaLettura() {
  fetch("/mirino/lettura", { cache: "no-store" })
    .then(r => r.json())
    .then(d => {
      const e = $("m-corpo");
      const p = parole.mirino || {};
      if (d.stato !== "letto") {
        e.innerHTML = "<p class=fioco>" + sicuro(d.stato) + "</p>";
        return;
      }
      const cl = d.livello === "certo" ? "certo"
               : d.livello === "dubbio" ? "dubbio" : "nulla";
      e.innerHTML =
        "<h3>" + sicuro(p.legge || "Cosa legge") + " · " + d.durata + " s</h3>" +
        (d.righe.length
          ? "<ul>" + d.righe.slice(0, RIGHE_MOSTRATE).map(r =>
              "<li><code>" + sicuro(r) + "</code></li>").join("") + "</ul>" +
            (d.righe.length > RIGHE_MOSTRATE
              ? "<p class=fioco>e altre " + (d.righe.length - RIGHE_MOSTRATE) + "</p>"
              : "")
          : "<p class=fioco>" + sicuro(p.niente || "—") + "</p>") +
        "<h3>" + sicuro(p.trova || "Cosa trova") + "</h3>" +
        "<p><b class=" + cl + ">" + sicuro(d.livello) + "</b> · " + d.sicurezza + "</p>" +
        (d.nome ? "<p><b>" + sicuro(d.nome) + "</b><br>" + sicuro(d.cantina) +
           (d.annata ? " · " + sicuro(d.annata) : "") + "</p>" : "") +
        (d.candidati.length ? "<ul>" + d.candidati.map(c =>
           "<li>" + sicuro(c) + "</li>").join("") + "</ul>" : "") +
        "<p class=fioco>nitidezza " + d.nitidezza + " · posa " + d.posa + "</p>";
    })
    .catch(() => { /* la board sta rispondendo a qualcos'altro */ });
}

(function preparaMirino() {
  rendiToccabile($("m-torna"), () => chiediMirino(false));
})();

(function preparaAngolo() {
  const a = $("angolo");
  a.addEventListener("pointerdown", (e) => {
    try { a.setPointerCapture(e.pointerId); } catch { /* poco importa */ }
    gesto = { id: e.pointerId, x: e.clientX, y: e.clientY,
              t: setTimeout(apriImpostazioni, ANGOLO_TENUTA) };
  });
  a.addEventListener("pointermove", (e) => {
    if (!gesto || e.pointerId !== gesto.id) return;
    if (Math.abs(e.clientX - gesto.x) > ANGOLO_SCARTO ||
        Math.abs(e.clientY - gesto.y) > ANGOLO_SCARTO) annullaGesto();
  });
  /* pointercancel è il caso che conta: il browser lo manda quando si prende
     il tocco per un gesto suo, e senza di lui il pointerup non arriva mai. */
  a.addEventListener("pointerup", annullaGesto);
  a.addEventListener("pointercancel", annullaGesto);
  document.addEventListener("visibilitychange", annullaGesto);
  /* Si torna alle impostazioni, non allo schermo del tavolo: chi e' entrato
     per guardare lo stato di solito vuole anche l'interruttore. */
  rendiToccabile($("d-chiudi"), () => { $("diagnostica").hidden = true; });
})();
</script>
